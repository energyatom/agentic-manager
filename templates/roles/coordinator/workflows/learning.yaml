schema_version: 1
name: Learning loop
team: team
description: The Coordinator's learning loop. It reads the review notes, returns and status reasons of recent runs and proposes changes to the seats' instructions, which a person approves. It ships with no trigger, so it runs only when started by hand until the owner adds a schedule.
caps:
  per_run: 30
  per_week: 60
steps:
  - id: review
    seat: coordinator
    instruction: Read the review notes, returns and status-change reasons of the recent runs and list the problems that repeat, each with the runs it comes from.
  - id: propose
    seat: coordinator
    instruction: For each repeating problem, propose one change to a seat's instructions with propose_change, citing the runs it comes from. Never apply a change yourself.
