schema_version: 2
name: Record
team: core
description: A writing step, a step that declares nothing and a document step.
steps:
  - id: collect
    seat: writer
    instruction: Record each entry you are given with table_write.
    table: entries
  - id: plain
    seat: writer
    instruction: Say in one line what was recorded.
  - id: summarise
    seat: writer
    instruction: Write the summary note in Markdown.
    document: summary-note
