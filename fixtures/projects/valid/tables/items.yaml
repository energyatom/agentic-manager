schema_version: 2
name: Items
team: core
key: ref
columns:
  - id: ref
    type: text
    required: true
  - id: title
    type: text
  - id: amount
    type: number
  - id: status
    type: status
    values:
      - new
      - done
    transitions:
      - from: new
        to: done
views:
  - id: open
    name: Open items
    columns:
      - ref
      - title
      - status
grants:
  - support
