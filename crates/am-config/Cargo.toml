[package]
name = "am-config"
description = "Project config loader, validator and writer: canonical emit, atomic writes, History, Undo and Restore (AD-16, R1, R3)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Crash simulation for the writer's tests (`ConfigWriter::fail_at`): enabled
# only through dev-dependencies (this crate's tests and am-e2e), never in the app.
test-support = []

[dependencies]
am-domain.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
croner.workspace = true
jiff.workspace = true
thiserror.workspace = true
url.workspace = true
globset.workspace = true
notify.workspace = true

[dev-dependencies]
tempfile.workspace = true
am-testkit.workspace = true
am-config = { path = ".", features = ["test-support"] }
