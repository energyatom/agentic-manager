[package]
name = "am-engine"
description = "Application core: runs, ToolGate, scheduler, cancellation tree (AD-8, AD-11, AD-18, AD-20)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
am-domain.workspace = true
am-store.workspace = true
tokio.workspace = true
tokio-util.workspace = true
croner.workspace = true
jiff.workspace = true
jiff-croner.workspace = true
tracing.workspace = true
thiserror.workspace = true
# Story 3.3: a loop-back reads the producing step's final message as a JSON
# object (AD-36), and a tool call's `Actor::Seat` names the run by its UUID
# (AD-24). Both are workspace-pinned crates already in the graph.
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
am-testkit.workspace = true
tempfile.workspace = true
# Story 3.3: the wall-clock cap runs on paused time (tests/loop_caps.rs;
# xtask/tests/paused_time.rs needs it named here).
tokio = { workspace = true, features = ["test-util"] }
# Story 3.3 review round 1: the sha256 an unknown tool name is kept as (P15),
# and a raw `started_at` moved back in a test of the wall-clock cap (P1).
sha2.workspace = true
hex.workspace = true
rusqlite.workspace = true
