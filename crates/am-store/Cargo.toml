[package]
name = "am-store"
description = "SQLite system of record: writer task, read-only readers, journal, ledger, audit (AD-6..AD-9, AD-25)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test fixtures (`am_store::testing`): a direct write path with no Actor or
# audit, so it is enabled only through dev-dependencies (this crate's own
# tests and am-e2e), never in the app.
test-support = []

[dependencies]
am-domain.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
jiff.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
am-store = { path = ".", features = ["test-support"] }
