[package]
name = "am-app"
description = "Composition root and the `agentic` CLI (AD-32)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "agentic"
path = "src/main.rs"

[features]
# Fail points for the resolver's tests (`am_app::runtime::testing`): enabled
# only through dev-dependencies, never in the app.
test-support = ["am-store/test-support", "am-config/test-support"]

[dependencies]
am-domain.workspace = true
am-config.workspace = true
am-store.workspace = true
am-engine.workspace = true
am-net.workspace = true
am-providers.workspace = true
am-tools.workspace = true
am-connectors.workspace = true
am-render.workspace = true
am-services.workspace = true
am-mcp.workspace = true
am-extract.workspace = true
am-secrets.workspace = true
am-api.workspace = true
am-server.workspace = true
tokio.workspace = true
tokio-util.workspace = true
jiff.workspace = true
tracing.workspace = true

# Story 2.1 (AD-15, Stack): termios through nix's `term` feature, to read
# the Account key with echo off (`terminal.rs`, Unix only); the `^C` test
# also drives the binary on a pseudo-terminal with it (openpty, tcgetattr).
# See docs/crate-notes/nix.md.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
am-app = { path = ".", features = ["test-support"] }
am-store = { workspace = true, features = ["test-support"] }
am-config = { workspace = true, features = ["test-support"] }
am-testkit.workspace = true
tempfile.workspace = true
# Story 1.8's serve test seeds config intents by their sha256.
sha2.workspace = true
hex.workspace = true
