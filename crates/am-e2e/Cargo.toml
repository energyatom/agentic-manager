[package]
name = "am-e2e"
description = "End-to-end and trust tests (AD-33). Spike: tests/spike/c1..c7."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[test]]
name = "spike"
path = "tests/spike/main.rs"

[[test]]
name = "cli_validate"
path = "tests/cli_validate.rs"

# Every file in tests/trust/ has a target named after it; `trust_targets_listed`
# fails when one is missing, so the release gate runs them all (AD-33).
# Story 1.8: config writer, History, Undo and Restore on a real store.
[[test]]
name = "config_history"
path = "tests/config_history.rs"

# Story 1.9: outside edits wait for Reload, on a real store.
[[test]]
name = "config_reload"
path = "tests/config_reload.rs"

# Story 1.10: config migrations offered and accepted, with the database
# migrated after a backup, on a real store.
[[test]]
name = "config_migrate"
path = "tests/config_migrate.rs"

[[test]]
name = "trust_targets"
path = "tests/trust_targets.rs"

[[test]]
name = "rule_16_audit_log"
path = "tests/trust/rule_16_audit_log.rs"

# Story 2.2: RULE-9, the egress client blocks everything unlisted. The
# shared fakes live in tests/trust/support/ (a folder, so not a target).
[[test]]
name = "rule_09_callers"
path = "tests/trust/rule_09_callers.rs"

[[test]]
name = "rule_09_addresses"
path = "tests/trust/rule_09_addresses.rs"

[[test]]
name = "rule_09_redirects"
path = "tests/trust/rule_09_redirects.rs"

[[test]]
name = "rule_09_requests"
path = "tests/trust/rule_09_requests.rs"

[[test]]
name = "rule_09_audit_store"
path = "tests/trust/rule_09_audit_store.rs"

# Story 3.2: RULE-15, the loopback server's Host, Origin, launch code,
# pairing code, CSRF, CLI token, route classes, envelope, run status and
# event stream (AD-13, AD-14, AD-15). The shared rig lives in
# tests/trust/support/server.rs (a folder, so not a target).
[[test]]
name = "rule_15_signin"
path = "tests/trust/rule_15_signin.rs"

[[test]]
name = "rule_15_host"
path = "tests/trust/rule_15_host.rs"

[[test]]
name = "rule_15_csrf"
path = "tests/trust/rule_15_csrf.rs"

[[test]]
name = "rule_15_state_changes"
path = "tests/trust/rule_15_state_changes.rs"

[[test]]
name = "rule_15_pairing"
path = "tests/trust/rule_15_pairing.rs"

[[test]]
name = "rule_15_cli_token"
path = "tests/trust/rule_15_cli_token.rs"

[[test]]
name = "rule_15_events"
path = "tests/trust/rule_15_events.rs"

[[test]]
name = "rule_15_runs"
path = "tests/trust/rule_15_runs.rs"

[[test]]
name = "rule_15_permissions"
path = "tests/trust/rule_15_permissions.rs"

[[test]]
name = "rule_15_secrets"
path = "tests/trust/rule_15_secrets.rs"

[dev-dependencies]
am-app.workspace = true
# Story 3.2: the error envelope and the run and event DTOs (AD-14).
am-api.workspace = true
am-config = { workspace = true, features = ["test-support"] }
am-domain.workspace = true
am-engine.workspace = true
# `testing::database_at_version` (story 1.10).
am-store = { workspace = true, features = ["test-support"] }
am-net.workspace = true
am-providers.workspace = true
am-tools.workspace = true
am-mcp.workspace = true
am-secrets.workspace = true
am-server.workspace = true
am-testkit.workspace = true
tokio.workspace = true
tokio-util.workspace = true
jiff.workspace = true
tempfile.workspace = true
# Raw SQL against a project's state.db and the export's JSON (story 1.7).
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
# Story 3.2: a subscriber that captures log lines (rule_15_secrets).
tracing.workspace = true
