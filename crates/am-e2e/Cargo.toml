[package]
name = "am-e2e"
description = "End-to-end and trust tests (AD-33). Spike: tests/spike/c1..c7."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[test]]
name = "spike"
path = "tests/spike/main.rs"

[[test]]
name = "cli_validate"
path = "tests/cli_validate.rs"

# Every file in tests/trust/ has a target named after it; `trust_targets_listed`
# fails when one is missing, so the release gate runs them all (AD-33).
# Story 1.8: config writer, History, Undo and Restore on a real store.
[[test]]
name = "config_history"
path = "tests/config_history.rs"

# Story 1.9: outside edits wait for Reload, on a real store.
[[test]]
name = "config_reload"
path = "tests/config_reload.rs"

# Story 1.10: config migrations offered and accepted, with the database
# migrated after a backup, on a real store.
[[test]]
name = "config_migrate"
path = "tests/config_migrate.rs"

[[test]]
name = "trust_targets"
path = "tests/trust_targets.rs"

[[test]]
name = "rule_16_audit_log"
path = "tests/trust/rule_16_audit_log.rs"

# Story 2.2: RULE-9, the egress client blocks everything unlisted. The
# shared fakes live in tests/trust/support/ (a folder, so not a target).
[[test]]
name = "rule_09_callers"
path = "tests/trust/rule_09_callers.rs"

[[test]]
name = "rule_09_addresses"
path = "tests/trust/rule_09_addresses.rs"

[[test]]
name = "rule_09_redirects"
path = "tests/trust/rule_09_redirects.rs"

[[test]]
name = "rule_09_requests"
path = "tests/trust/rule_09_requests.rs"

[[test]]
name = "rule_09_audit_store"
path = "tests/trust/rule_09_audit_store.rs"

# Story 3.2: RULE-15, the loopback server's Host, Origin, launch code,
# pairing code, CSRF, CLI token, route classes, envelope, run status and
# event stream (AD-13, AD-14, AD-15). The shared rig lives in
# tests/trust/support/server.rs (a folder, so not a target).
[[test]]
name = "rule_15_signin"
path = "tests/trust/rule_15_signin.rs"

[[test]]
name = "rule_15_host"
path = "tests/trust/rule_15_host.rs"

[[test]]
name = "rule_15_csrf"
path = "tests/trust/rule_15_csrf.rs"

[[test]]
name = "rule_15_state_changes"
path = "tests/trust/rule_15_state_changes.rs"

[[test]]
name = "rule_15_pairing"
path = "tests/trust/rule_15_pairing.rs"

[[test]]
name = "rule_15_cli_token"
path = "tests/trust/rule_15_cli_token.rs"

[[test]]
name = "rule_15_events"
path = "tests/trust/rule_15_events.rs"

[[test]]
name = "rule_15_runs"
path = "tests/trust/rule_15_runs.rs"

[[test]]
name = "rule_15_permissions"
path = "tests/trust/rule_15_permissions.rs"

[[test]]
name = "rule_15_secrets"
path = "tests/trust/rule_15_secrets.rs"

# Story 3.3: taint through hand-offs, taint at rest and the two sources of
# a TrustedInput (AD-10, amended 2026-11-23). Each file in tests/trust/ has
# its target (`trust_targets_listed`).
[[test]]
name = "taint_handoff_chain"
path = "tests/trust/taint_handoff_chain.rs"

[[test]]
name = "taint_at_rest"
path = "tests/trust/taint_at_rest.rs"

[[test]]
name = "taint_trusted_input_sources"
path = "tests/trust/taint_trusted_input_sources.rs"

[[test]]
name = "taint_trusted_input_refusals"
path = "tests/trust/taint_trusted_input_refusals.rs"

# Story 3.3: the engine's cross-step primitives (AD-36, AD-40..AD-44). The
# release gate runs every file in tests/engine/ by directory, so each has a
# target named after it (`engine_targets_listed`); the shared rig lives in
# tests/engine/support/ (a folder, so not a target).
[[test]]
name = "handoff_next"
path = "tests/engine/handoff_next.rs"

[[test]]
name = "handoff_loop_back"
path = "tests/engine/handoff_loop_back.rs"

[[test]]
name = "handoff_gate"
path = "tests/engine/handoff_gate.rs"

# Story 3.4: the Owner gate. The engine applies a person's resolution and
# goes on (tests/engine/); only a person resolves, the Inbox over /api/v1
# (RULE-15) and the return note as a TrustedInput (AD-10) (tests/trust/).
# Story 3.4's server rig addition lives in tests/trust/support/inbox.rs.
[[test]]
name = "handoff_gate_resolve"
path = "tests/engine/handoff_gate_resolve.rs"

[[test]]
name = "inbox_resolve_human_only"
path = "tests/trust/inbox_resolve_human_only.rs"

[[test]]
name = "rule_15_inbox"
path = "tests/trust/rule_15_inbox.rs"

[[test]]
name = "taint_trusted_input_gate_note"
path = "tests/trust/taint_trusted_input_gate_note.rs"

# Story 3.5: labelled prompt assembly and schema repair (AD-10, AD-27,
# AD-36). The assembler's journal and the repair loop are engine tests
# (tests/engine/); the type wall, the fence, names only and the repair's
# taint are trust tests (tests/trust/).
[[test]]
name = "prompt_assembly_journal"
path = "tests/engine/prompt_assembly_journal.rs"

[[test]]
name = "schema_repair"
path = "tests/engine/schema_repair.rs"

[[test]]
name = "taint_prompt_type_wall"
path = "tests/trust/taint_prompt_type_wall.rs"

[[test]]
name = "taint_prompt_fence"
path = "tests/trust/taint_prompt_fence.rs"

[[test]]
name = "taint_prompt_names_only"
path = "tests/trust/taint_prompt_names_only.rs"

[[test]]
name = "taint_prompt_repair"
path = "tests/trust/taint_prompt_repair.rs"

# Story 3.6: rows and documents written with provenance (AD-8, AD-10 as
# amended 2026-11-24, AD-11, AD-21, AD-29, AD-43, AD-46). The engine's
# row writes, idempotency and document versions are engine tests
# (tests/engine/); the Tables grant, the declared-table binding, taint at
# rest, the engine result, the row reader, untrusted Markdown and RULE-16's
# row provenance are trust tests (tests/trust/).
[[test]]
name = "rows_table_write"
path = "tests/engine/rows_table_write.rs"

[[test]]
name = "rows_idempotent"
path = "tests/engine/rows_idempotent.rs"

[[test]]
name = "documents_versions"
path = "tests/engine/documents_versions.rs"

[[test]]
name = "capabilities_tables_grant"
path = "tests/trust/capabilities_tables_grant.rs"

[[test]]
name = "taint_rows_declared_table"
path = "tests/trust/taint_rows_declared_table.rs"

[[test]]
name = "taint_rows_at_rest"
path = "tests/trust/taint_rows_at_rest.rs"

[[test]]
name = "taint_tool_result_engine_values"
path = "tests/trust/taint_tool_result_engine_values.rs"

[[test]]
name = "taint_rows_reader"
path = "tests/trust/taint_rows_reader.rs"

[[test]]
name = "taint_rows_reader_fence"
path = "tests/trust/taint_rows_reader_fence.rs"

[[test]]
name = "taint_rows_reader_start"
path = "tests/trust/taint_rows_reader_start.rs"

[[test]]
name = "taint_documents_untrusted_markdown"
path = "tests/trust/taint_documents_untrusted_markdown.rs"

[[test]]
name = "taint_documents_at_rest"
path = "tests/trust/taint_documents_at_rest.rs"

[[test]]
name = "rule_16_row_provenance"
path = "tests/trust/rule_16_row_provenance.rs"

# Story 3.6's ToolGate slice: the engine result journaled on its tool
# call's row and rebuilt from the writer's record (AD-8, AD-10 with
# Winston's wording; row 44), and no row content reaching a model call
# (owner conditions a and b; row 43).
[[test]]
name = "engine_result_journal"
path = "tests/engine/engine_result_journal.rs"

[[test]]
name = "taint_rows_no_read_path"
path = "tests/trust/taint_rows_no_read_path.rs"

# Story 3.24 (owner quality plan part 1; AD-33's golden e2e, the Structural
# Seed's tests/golden/): the sample validated, the real flow's refusal
# pinned and its cut-down copy run on FakeLlm, on every PR. `just
# check` runs it with no feature, ignore or recipe (`golden_targets_listed`,
# `golden_so_far_runs_in_just_check`); its rig lives in tests/golden/support/.
[[test]]
name = "golden_so_far"
path = "tests/golden/golden_so_far.rs"

[dev-dependencies]
am-app.workspace = true
# Story 3.2: the error envelope and the run and event DTOs (AD-14).
am-api.workspace = true
am-config = { workspace = true, features = ["test-support"] }
am-domain.workspace = true
am-engine.workspace = true
# `testing::database_at_version` (story 1.10).
am-store = { workspace = true, features = ["test-support"] }
am-net.workspace = true
am-providers.workspace = true
am-tools.workspace = true
am-mcp.workspace = true
am-secrets.workspace = true
am-server.workspace = true
am-testkit.workspace = true
tokio.workspace = true
tokio-util.workspace = true
jiff.workspace = true
tempfile.workspace = true
# Raw SQL against a project's state.db and the export's JSON (story 1.7).
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
# Story 3.2: a subscriber that captures log lines (rule_15_secrets).
tracing.workspace = true
# Story 3.3: the trait probes of taint_trusted_input_refusals (no
# Deserialize) and the seat and proposal ids of an Actor.
serde.workspace = true
uuid.workspace = true
