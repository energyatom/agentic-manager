# Planted ticket tree for story 3.25's register check (xtask/tests/register.rs).
# Table order is build order: epics 1, 3, 2, never sorted by id.

[[epic]]
id = 1
slug = "epic-one"
title = "Epic one"
risk = "low"

[[epic]]
id = 3
slug = "epic-three"
title = "Epic three, built before epic two"
risk = "low"
after = [
  { epic = 1, needs = "every entry of the first epic" },
]

[[epic]]
id = 2
slug = "epic-two"
title = "Epic two, built last"
risk = "low"
after = [
  { epic = 1, needs = "the first epic's spike" },
  { epic = 3, needs = "the third epic, listed before this one" },
]
