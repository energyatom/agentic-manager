[[entry]]
id = 5
type = "story"
title = "Locked, audited and pinned supply chain"
description = "Extends epic 1's CI baseline for releases: builds use --locked and npm ci; cargo-deny (licences, advisories, bans), cargo-audit and npm audit fail the release; a check fails any workflow step not pinned by SHA or any job token wider than it needs; the no-telemetry test runs on the release build. Owner step: require one approving review on main in branch protection and enable 2FA for maintainers."
verify = "Seeded test branches fail the release workflow for: a GPL crate, a crate with a known advisory, an npm package with a high advisory, an unpinned Action, a job with write-all permissions and an unlocked build; the clean branch passes; the repo settings export shows required review on main."
covers = ["R5"]
after = [3]
hitl = true
risk = "high"

[[entry]]
id = 6
type = "story"
title = "SBOM, provenance and Scorecard"
description = "Each release publishes a CycloneDX SBOM for the Rust and web dependencies, GitHub build provenance attestations and a checksums file for every artefact; the OpenSSF Scorecard workflow runs on main with results published, its badge is on the README, and dangerous-workflow, pinned-dependencies and token-permissions findings are fixed. The SBOM also lists every bundled non-Rust component (final review 2 security M5, 2026-11-19): the CPython build, SearXNG at its commit with its hash-locked Python dependencies, Granian, each with version, licence and sha256."
verify = "A draft release carries the SBOM, attestations verifiable with `gh attestation verify` for each artefact, and checksums; the Scorecard run shows no dangerous-workflow, pinned-dependencies or token-permissions findings and the README badge resolves. The SBOM lists the Python runtime and every package in the SearXNG lock file with their hashes, and no OCR component (retired 2026-11-19)."
covers = ["R6"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Parser fuzzing gate"
description = "Builds on the cargo-fuzz targets and nightly job from epic 4 story 6 (PDF text layer, xlsx, text decoding, zip; the docx and pptx targets went with their readers on 2026-11-19), adding a CSV target and corpus retention; the release workflow refuses to publish unless each target has at least one cumulative hour without an open crash; a found crash files its reproducer as a regression test. Adds fuzz targets for HTML extraction (dom_smoothie, scraper, htmd), feeds and sitemaps (feed-rs, quick-xml), the media-type sniffing of linked-folder files (leading bytes; added 2026-11-19), link lists (.url, .webloc, links.txt) and the CDP pipe framing (final review 2 security M5, 2026-11-19)."
verify = "The nightly fuzz job runs every target and stores its corpus; a seeded crashing input makes the release gate fail and adds a regression test; with the seed removed the gate passes and reports fuzz hours per target. The gate lists the HTML, feed, sitemap, image, link-list and CDP-framing targets with their fuzz hours."
covers = ["R7"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Security suites gate every release"
description = "The release workflow publishes nothing unless, on the signed macOS Apple Silicon build, every suite under crates/am-e2e/tests/trust/ and crates/am-e2e/tests/engine/ passes, selected by directory and never by a hand-kept list (final review 2 security M5, 2026-11-19): rule_08 to rule_19 (including rebinding, CSRF and WebSocket, path traversal and symlink escape, budget and kill-switch, secret-leak scan), connectors_*, local_search_*, capabilities_*, folder_access_*, taint_*, widening_*, sandbox_* and the cross-department engine suites, together with the golden run and injection pack on FakeLlm; the owner's real-local-model golden run and injection pack record for the same commit is required before a tag. The gate also checks entitlements per binary: the main app carries no com.apple.security.cs.disable-library-validation, allow-unsigned-executable-memory or allow-dyld-environment-variables entitlement, and each helper (agentic-extract, the Python executable) carries exactly its AD-13 App Sandbox set."
verify = "A release run lists every trust suite as passed on the signed macOS build; a seeded failing trust test stops publishing; tagging without the owner's real-model record for that commit is refused by the gate. A test file added to tests/trust/ without being listed anywhere runs in the gate; a seeded disable-library-validation entitlement on the main app stops publishing."
covers = ["R8"]
after = [7]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "SECURITY.md, threat model and protections page checked"
description = "Publishes SECURITY.md (private disclosure channel, response target, advisory process) and docs/threat-model.md (assets, the eight attacker stories, mitigations and residual risks); reviews the Settings › About protections page from epic 9 against them so each 'protects' claim names its test id and each 'does not' is stated (prompt injection mitigated by architecture, not solved; read-tool exfiltration mitigated, not eliminated, through the link a model chooses; stdio MCP network declared, not enforced; other processes of the same OS user are outside the full threat model; the Apply real-click check is client-side only; the live database relies on OS disk encryption); a CI check fails when a claimed test id does not exist or a residual risk is missing from the page. The protections page also states (2026-11-19, final review 2 security H5): the parser and Local search run in the macOS App Sandbox; files a seat attaches to a cloud model leave this Mac for that provider (2026-11-19); the rendering browser and stdio MCP servers run as you and are not sandboxed by the app, so while either is enabled every decision is made in the app's window; Local search's engine hosts are proxied by configuration, not enforced by the OS."
verify = "SECURITY.md and the threat model are in the repo and linked from the README; the CI check passes, and fails when a claim's test file is renamed or a residual risk is deleted from the page."
covers = ["R9"]
after = [8]
hitl = false
risk = "high"

