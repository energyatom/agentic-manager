# Epic 11 — Desktop, release and trust gate (v0.9-rc). Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>' (final review coverage F8).
# Desktop lane (1–4) shares am-desktop and the release jobs; gate lane (5–8) shares .github/workflows/release; docs lane (9–11) shares docs/.
# Dropped 2026-11-19 (owner Mac first; id kept, never reused): 4 'Signed Windows and Linux builds' -> v1.x; the portability check lives in story 1.2's CI.
# Every trust-gate.md rule maps to a story: signing (3), updates and key rotation (2), supply chain and CI (5), SBOM, provenance, Scorecard (6),
# parser fuzzing (7), security suites as gates (8), SECURITY.md, threat model, protections page (9), docs (10, 11), review window (13), v1.0 gate (15).
# 2026-11-19 owner folder-access direction: 16 bundles Local search only (OCR retired); 6, 7, 8 and 9 drop Tesseract, Leptonica, pdfium, docx and pptx and add the folder suites.

[[entry]]
id = 1
type = "story"
title = "Desktop app opens the project on macOS"
description = "Tracer bullet: am-desktop (Tauri 2) links am-app in-process with no sidecar, starts the loopback server, hands the webview its session through bootstrap IPC, serves the embedded UI under a strict CSP (connect-src the loopback API origin, no remote content), exposes only session bootstrap and window control IPC with minimal capabilities, registering the updater IPC group disabled (every updater command refused) until story 2 verifies signatures (final review F7d), and adds the macOS menu items mirroring the toolbar; the rule_17 tests are written to fail first. Owner step: launch the dev build on the owner's Mac with the owner's project."
verify = "rule_17 trust tests pass: the capability file grants only the three IPC groups and every updater command is refused in this story's build, a page attempt to load a remote script, image or font is blocked by CSP, an undeclared IPC command is rejected, and no sidecar process exists; the owner's dev build opens the owner's project on the Org view with File › Stop everything ⌘. working."
covers = ["R1"]
after = ["10.11"]
hitl = true
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Updates are verified, newer-only and asked for"
description = "tauri-plugin-updater with a pinned minisign public key separate from the code-signing keys reads a signed update manifest from GitHub Releases; it offers only a newer version ('Version 1.1 is ready. Install on next launch?' with the verified signature stated in Settings › Updates and the sidebar foot), installs only after consent, and refuses a downgrade or a bad signature with the reason in words; docs/update-key.md holds the key rotation plan. Matches key-schedule-updates.html §2 (Updates consent)."
verify = "The updater IPC group from story 1 is enabled only now, and its rule_17 test is updated to expect it; against a local test release server signed with a test key: a newer signed update is offered and installs only after consent; an older version, an equal version, a manifest signed with another key and a tampered artefact are each refused with a worded reason and nothing installs; the updater contacts no host but the release host; docs/update-key.md describes rotation and the separate key's custody."
covers = ["R4"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 16
type = "story"
title = "Bundle Local search in the macOS installer with its licence notice"
description = "Owner addition 2026-11-18 (built-ins shipped in the install; arch AD-45, AD-46): the macOS arm64 release job (the only v1 target, owner 2026-11-19; arch AD-47) runs `xtask bundle-services` and places services/searxng/ (pinned Python, SearXNG at its pinned commit, Granian) read-only inside the app bundle, every Mach-O and executable in them signed with the app's identity under the hardened runtime (macOS) and covered by notarisation; the manifest hash compiled into the binary matches the shipped tree; THIRD_PARTY.md and Settings › About list SearXNG (AGPL-3.0-or-later, unmodified, separate process, with the commit and where its corresponding source is), and each GitHub Release attaches the SearXNG source archive; cargo-deny's licence policy keeps AGPL out of the linked crate graph; story 3's clean-Mac check includes a web search answered by Local search with no key. Owner step: none beyond story 3's. Signs each helper with its own entitlements (final review 2 security H5, 2026-11-19; arch AD-13): agentic-extract with com.apple.security.app-sandbox only, the bundled Python executable with app-sandbox and network.client; Local search's state folder is the Python helper's sandbox container."
verify = "Written first, failing: on the macOS release artefact in CI, the bundled trees' hashes equal the binary's manifest, `codesign --verify --deep --strict` and `spctl --assess` pass with the Python binaries inside, and a smoke test on a clean macOS runner with no network keys starts the app, sees Local search reach running and gets a JSON search answer from a recorded engine fixture; THIRD_PARTY.md and the About page name SearXNG's licence, commit and source link; the release has the source archive attached; cargo-deny shows no AGPL crate linked. `codesign -d --entitlements -` on each helper in the notarised bundle prints exactly its set, and the sandbox self-test passes on the clean macOS runner."
covers = ["R13", "R2", "R9"]
after = [2, "12.18"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Signed and notarised macOS installer"
description = "Gate first (owner, 2026-11-19; the deferred stack-spike criterion 8): before any other work in this story, with the owner's Developer ID certificate and notarisation credentials (an app-specific password or App Store Connect API key) in CI secrets, a signed and notarised Tauri build that links the core in-process launches on a clean Mac (or a fresh macOS user account) and serves the UI, and the result is added to docs/spike-report.md as criterion 8's verdict; if it fails, the story stops and Sofia replans the release lane. Then: the release job builds the Apple Silicon app and installer, signs it with Developer ID from CI secrets, enables the hardened runtime, notarises and staples it, and publishes it to a draft GitHub Release; first run needs no runtime. Owner steps: install it on a clean Mac, time install to first run and to the first successful run (a Blank department seat, or the Company A sample's flow F1), and record both; the first successful run uses a local model server and no keys, with a web search step answered by Local search (RULE-20, 2026-11-18)."
verify = "docs/spike-report.md records criterion 8 as pass from the owner's clean-Mac run of the signed and notarised build before the installer work merges; `spctl --assess` and `stapler validate` pass on the published artefact in CI; the owner's clean-Mac record shows first run under 5 minutes and the first successful run within 15 minutes of install, with no Gatekeeper warning."
covers = ["R2"]
after = [2, 16]
hitl = true
risk = "high"

