verify = "Written first, failing (crates/am-e2e/tests/trust/connectors_caps_*.rs): a fixture Source with a 5-page budget over a 20-page fixture site makes exactly 5 page requests and reports the stop; a fixture paid connector whose reservation would cross D1-E1's weekly cap makes no call and raises a Budget ask; a fixture service reporting more usage than reserved never leaves settled spend above any cap (the next reservation is refused); with max_uses_per_step 3 the fourth web_search call in a step is refused by ToolGate and logged; a load past max_loads_per_day is skipped with its reason; the meter's figure includes settled plus reserved service spend."
