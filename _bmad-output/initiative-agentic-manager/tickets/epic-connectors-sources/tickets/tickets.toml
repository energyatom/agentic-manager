[[entry]]
id = 7
type = "story"
title = "Built-in crawler: scoped, polite, resumable, only what changed"
description = "The crawler connector (arch AD-39): from a Crawler Source's start pages it reads static HTML only, follows links whose host is in scope.allowed_hosts and whose path matches an include and no exclude glob, to max_depth and the page budget (checked before each fetch), drops query strings unless a glob names them and records out-of-scope links as skipped; the frontier lives in the crawl_frontier table (canonical URL, depth, state, discovered-from, ETag, hash), so a killed load resumes without refetching committed pages; requests are conditional (ETag, Last-Modified) and a page whose extracted text hash is unchanged writes nothing; every request goes through `Fetcher` (robots.txt with Crawl-delay, at least 1 s per host); pages load as untrusted records or as rows through the Source's mapping and key."
verify = "Written first, failing (crates/am-e2e/tests/trust/connectors_crawl_*.rs, recorded fixture site and FakeClock): with depth 2 and budget 10 over a 30-page site the crawler requests exactly the in-scope pages up to depth 2 and never more than 10; links to an out-of-scope host, an excluded path and a robots-disallowed path get zero requests and are reported as skipped; no two requests to one host are less than 1 s apart, or the Crawl-delay where larger; a kill -9 after 6 committed pages resumes and requests none of those 6 again; a second load where 2 pages changed (one by ETag, one by content) writes exactly 2 changed records and requests unchanged pages only conditionally; a URL with a tracking query string is fetched once without it; a poisoned page listing links to evil.example and asking to fetch them yields zero requests outside scope."
covers = ["R6", "R15"]
after = [2]
hitl = false
risk = "high"

[[entry]]
id = 17
type = "story"
title = "Rendered Reader: pages built by scripts in a local browser"
description = "Adds rendering to the http-reader and crawler connectors (owner decision 2026-11-18, free and local instead of a paid crawl account; arch AD-39, AD-12, AD-13): the PageRenderer port in am-domain and a new adapter crate am-render driving CDP over a pipe (final review 2 security M2, owner delegated 2026-11-19): the browser is started with --remote-debugging-pipe (descriptors 3 and 4 mapped with command-fds 0.3.3) and never a debugging port, with am-render's own NUL-delimited pipe transport over chromiumoxide_cdp 0.9.1's generated types, and chromiumoxide 0.9.1 used only for browser detection (its WebSocket Browser::launch and connect banned; docs/crate-notes/chromiumoxide.md written first), with the `agentic __render` child entry that speaks JSON-RPC over stdio to the parent; a Source file gains `render: true` (epic 1 story 12's schema) and tools.yaml an optional `render.browser_path`; the browser is a Chrome, Chromium or Edge found by chromiumoxide's detection or that path, never bundled or downloaded; the child starts under the AD-13 child rules and launches it headless with a fresh temporary profile (deleted after the load; stale ones removed at start), its sandbox on, downloads denied, service workers bypassed, WebRTC limited to proxied traffic and `--proxy-server` at a closed loopback port with --proxy-bypass-list=<-loopback> (Chromium otherwise bypasses the proxy for loopback), --host-resolver-rules=\"MAP * ~NOTFOUND\", --use-mock-keychain and --password-store=basic, so loopback and WebSocket traffic the Fetch domain does not see fails; every request the page makes is paused through the CDP Fetch domain and performed by the parent through `Fetcher` (scope hosts and owner seat's allow-list, blocked addresses, robots.txt per URL, at least 1 s per host with identical subresource URLs fetched once per load, product user agent, byte budget; GET, HEAD or POST with a capped body), images, media, fonts and beacons are not fetched, and refusals are counted in the ingest report; each page settles on 1 s of network idle or its render timeout (default 60 s, at most 120 s) under a 50-request cap; the serialised DOM goes through the extract child, mapping, dedupe and load like a static page, as UntrustedData; clippy disallowed-methods bans `Browser::connect`, `Browser::launch`, `no_sandbox` and `hidden`; the browser runs outside any app-applied OS sandbox (arch AD-13), so while a render Source is enabled CLI decisions move to the UI; Source health gains `needs_browser` (Browser not found, with the fix sentence) and `sandbox_unavailable` for the Connectors surface (13), Source health (14) and Doctor (9.8). CI's trust job installs Chromium; the browser-dependent tests name their skip reason where none is present, and the no-browser tests run everywhere."
verify = "Written first, failing (crates/am-e2e/tests/trust/connectors_render_*.rs, on am-testkit's loopback fixture site whose listing page is built by a script): (fresh profile) the fixture page reports empty document.cookie and localStorage at load start, a cookie the site set in the first load is absent in the second, and the temporary profile folder no longer exists after the load or, after a kill -9 of the child, after the next start; (egress, robots, budget) the page's scripts asking for an off-scope host, http://169.254.169.254/ and a robots-disallowed path produce zero requests at the fixture servers and are listed as refused in the ingest report, a page budget of 3 over 10 script-linked pages makes exactly 3 navigations, and the Fetcher's request log shows no two requests to one host under 1 s apart; (timeout) a page that never settles stops at a 2 s test timeout with 'Render timeout after 2 s' in the report and the load goes on to the next page; (untrusted) a rendered page carrying an injection string reaches a FakeLlm step only inside the untrusted fence, taints it and yields zero outbound calls and zero approvable proposals; (no browser) with detection given an empty PATH and no browser_path, `agentic sources test` and `agentic sources load` report 'Browser not found' with the fix sentence and make zero requests, the health API returns needs_browser with Doctor's fix, and a rendering-off Source in the same project still loads; (parity) the rendered listing maps to the same rows as the static fixture of the same content and a second load over unchanged content writes nothing; (lint) a fixture crate calling Browser::connect, no_sandbox or hidden fails clippy. (loopback and pipe, written first) a fixture page whose script opens new WebSocket('ws://127.0.0.1:<fixture port>') and fetches http://127.0.0.1:<fixture port>/ and http://localhost:11434/ makes zero connections at the fixture listeners and at a fake Ollama port; during a render lsof shows no listening TCP port owned by the browser or the child; with a render Source enabled, `agentic gate` resolves nothing and prints the open-item hint."
covers = ["R17", "R6", "R15", "R16"]
after = [7, "4.6"]
hitl = false
