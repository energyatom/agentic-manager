description = "The CrawlService port and its one adapter, a Firecrawl-compatible API endpoint (arch AD-39 as amended 2026-11-18; API v2): a crawl-service Account (models/accounts.yaml kind crawl-service, protocol firecrawl-v2, base_url) defaults to a service the owner self-hosts on loopback (http://localhost:3002, no key unless the owner enables its authentication; the AD-12 loopback exception for owner-typed ports that epic 2 story 3 builds for OpenAI-compatible Accounts) or names Firecrawl cloud (https://api.firecrawl.dev, key in the keychain); either is added through the privilege-widening confirmation and its declared network use is shown, as the service fetches pages itself; Add Account explains how to self-host and that the app links no service code; a Crawler Source with a crawl service (the crawler's mode choice that story 17 extends: built-in static, built-in rendered or crawl service) submits `POST /v2/crawl` with url, includePaths and excludePaths from its globs, maxDiscoveryDepth, limit (its page budget), allowExternalLinks false, allowSubdomains false, ignoreQueryParameters true and scrapeOptions { formats: [markdown], onlyMainContent: true }, never ignoreRobotsTxt; it first reserves limit × credits per page × the services price per credit (0 for a self-hosted endpoint, while limit still bounds the pages), then polls `GET /v2/crawl/<job-id>` until completed, failed or cancelled, follows `next` to read every result page at once (results are kept 24 h), checks each returned page's URL against robots.txt through `Fetcher` and drops a disallowed page as skipped, stores each page as an untrusted record through the same dedupe and report, and settles from creditsUsed; a failed or cancelled job raises a Failure item and a retry loads nothing twice; the Account's health (reachable, key present when needed) feeds Doctor. Was 'Firecrawl crawl adapter through an Account' until the 2026-11-18 owner decision."
