r under What leaves this Mac with the host; (caps) with a 3-file cap the fourth read_file is refused in words, a 33 MB file is refused before it is read, and the total-bytes cap refuses the next attach; (ledger) a 3-page PDF read reserves from the per-page estimate before the call and settles from the fixture's reported usage under D1-E1, and a reservation that would cross D1-E1's cap makes no call and raises a Budget ask; (audit) every list, read and write is in the audit log with root, path and hash and no file content; (cloud folders, restated 2026-11-20, architect REPLAN) with a fixture FileResidency, a folder under a fixture ~/Library/CloudStorage/<provider>/ links and a cloud-only file lists as local: false with zero reads, a cloud-only 40 MB file is refused before any download, one that does not arrive within the wait (and one failing with EDEADLK) returns the refusal naming the provider with zero bytes sent, one that arrives is attached and counted against the total cap, a denied File Provider access leaves the folder unlinked with its sentence, the read_write folder is listed under What leaves this Mac with its provider, and linking the project root or a folder containing it fails validate."
