title = "Local OCR service as the OCR provider (for example PaddleOCR)"
description = "DROPPED 2026-11-19 (owner folder-access direction: a local OCR model is loaded in LM Studio or Ollama and chosen as the seat's model; PaddleOCR's own MCP server stays usable as an ordinary MCP tool (epic 9); plan file status dropped; id kept, never reused). Historical text: Owner answer 2026-11-19 ('I can link it to an open model like PaddleOCR and then feed it to an agent'; arch AD-46 as amended 2026-11-19): built-in Tesseract (story 20) stays the default and the per-capability provider swap (story 19) gains a third choice for Documents & knowledge's OCR: a Local OCR service the owner runs on this Mac. Adds the `ocr-service` Account kind (models/accounts.yaml: kind ocr-service, protocol paddleocr-serving, base_url) and its one adapter: for a seat or Source whose Documents & knowledge provider is such an Account, the extract child rasterises each PDF page with no text layer (pdfium) or decodes a PNG, JPEG or TIFF under story 20's page and pixel caps and returns PNG bytes to the parent instead of running tesseract (the sandboxed child keeps no network); the parent sends each page through the egress client as `POST <base_url>/ocr` with JSON {file: <base64 PNG>, fileType: 1, visualize: false} (PaddleOCR's basic-serving contract, checked 2026-11-19), one page per request, 30 s a page, response capped at 2 MB, no redirects; it reads only result.ocrResults[*].prunedResult.rec_texts and rec_scores (every other field, images included, is discarded; a non-zero errorCode or a malformed body is a worded per-page failure) and returns the text as UntrustedData labelled 'OCR · <Account name>' with the mean of rec_scores as its confidence, feeding read_file, Knowledge indexing (story 11) and Local Repository loads (story 9, epic 4 story 7) exactly as story 20's output does. The base_url must be http on a loopback address (127.0.0.1, ::1 or localhost resolving to loopback) with an owner-typed port, pinned as the Account's host through the AD-12 owner-typed loopback exception (epic 2 story 3); `agentic validate` and Add Account refuse any other host in v1. Choosing it is privilege-widening (epic 4 story 17's classifier): the confirmation names the address and says 'Page images are sent to <Account> at 127.0.0.1:<port> on this Mac.' It costs nothing, so calls are counted but reserve ₹0. A failure (unreachable, timeout, errorCode) fails the step with an Inbox item, or uses the bundled Tesseract when the owner set 'Fall back to built-in', never another Account. The Account's health (Test sends one probe page; last error) feeds Doctor's OCR check (9.8). docs/ocr-service.md documents the request and response contract so any local OCR service can implement it, and shows starting PaddleOCR (Apache-2.0) on loopback: install PaddleOCR per its own guide (CPU wheels exist for macOS arm64), then `paddlex --install serving` and `paddlex --serve --pipeline OCR --host 127.0.0.1 --port 8080` (its default host is 0.0.0.0, so the host flag is required). It also notes the alternative that adds no code: PaddleOCR's own MCP server (`paddleocr_mcp`, stdio, or `--http` on 127.0.0.1:8000) added to a seat as an ordinary MCP tool (epic 9; arch AD-26), external-effect by default, whose results reach only that seat's steps as untrusted tool results and never Knowledge indexing or Local Repository loads. The app bundles, downloads and supervises no OCR service; bundling PaddleOCR is v1.x with Add-ons."
