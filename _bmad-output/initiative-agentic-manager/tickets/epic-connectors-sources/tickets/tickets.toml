[[entry]]
id = 1
type = "story"
title = "A Source loads one page into a table with provenance"
description = "Tracer bullet (arch AD-39): creates crates/am-connectors with the http-reader connector and extends epic 4 story 7's Connector, Source and SourceState ports with `Fetcher`, which wraps the egress client with the robots.txt check (texting_robots 0.2.2; cached 24 h; 4xx allows, 5xx or unreachable disallows), the product user agent and at least 1 s between requests to a host; an http-reader Source file (owner seat, URLs and allowed hosts, output table with a declarative mapping and key, terms_checked) validated by epic 1 story 12's schema; a load run (runs.kind = load, one deterministic step, no model, journaled) acquires the page, extracts it in the extract child (dom_smoothie main content, htmd Markdown, scraper tables and links, encoding_rs to UTF-8), maps the declared fields with a type check (no cleaning or enrichment), dedupes against source_items and the key, upserts rows with provenance (Source, connector, URL, fetched-at, hash, load run) and taint = 1 in one writer transaction, and records its ingest report; `agentic sources list|test|load|status` and the /api/v1 routes the UI will use; every fetch is audited with its Source."
verify = "Written first, failing: on recorded fixtures `agentic sources load` writes the page's mapped rows with provenance and taint and an ingest report (read 1, new N); (robots) a URL disallowed by robots.txt and a host whose robots.txt answers 503 each get zero page requests and appear as skipped in the report (crates/am-e2e/tests/trust/connectors_robots_disallow.rs); (incremental) a second load over the unchanged fixture writes zero rows and reports all unchanged, and a changed fixture updates only the changed row by key; (untrusted) a FakeLlm step reading the Source's rows is tainted and its drill-down shows them fenced, and a poisoned page that orders an outbound call yields zero outbound calls and zero approvable proposals; a host outside the owner seat's allow-list is refused and audited with zero requests; `agentic sources test` writes nothing (rows, records and source_items unchanged); the denylist scan stays green. (moved from epic 3 story 15, 2026-11-19) a Table T1 row loaded by this Source and carried in F1's hand-off taints D1-E1's step."
covers = ["R1", "R13", "R15"]
after = ["4.7", "4.9", "1.12"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Source limits, tool use counts and service spend in the ledger"
