ny path under a project root; `list_files` (read) lists entries filtered by glob, media type (extension and leading bytes), size and modified date (at most 10,000 entries a call) with name, path, size, type, date and, on request, sha256; `read_file` (read; story 11's tool generalised from Knowledge and file records to linked folders) attaches a file to the seat's model as a native file part through epic 2 story 9 when the model's file chip covers its type, else as text labelled text-fallback when the seat's `text_fallback` switch is on and the type is text-readable (txt, md, csv, tsv, json, a PDF's text layer through epic 4 story 6's child), else returns the worded refusal ('<seat>'s model (<model kind>) cannot read .<ext> files. Choose a model that reads <type> for this seat, or route these files to another seat.') with zero bytes sent and nothing converted; every file part or text enters the prompt inside the untrusted fence labelled file:<folder-id>/<path>@<sha256> (arch AD-27) and taints the step; `write_file` (local-write) is in the tool list only while the folder's access is read_write, creates or replaces files under the root, never deletes, moves or renames, and in a tainted step writes only declared paths; per-step caps (files read, default 50; bytes per file, default 32 MB and never above the provider's limit; total bytes, default 100 MB) are checked before each read; a file part reserves model spend from the capabilities file's per-type token estimate and settles from reported usage (arch AD-9); every list, read and write is audited with root, path and hash, never content; linking a folder, widening its patterns, turning write on, and linking one to a seat whose model or fallback is a cloud Account (or moving such a seat to a cloud model) are privilege-widening through epic 4 story 17's classifier, the cloud case's effect sentence saying the folder's files will leave this Mac for the Account's host; the What leaves this Mac lines epic 5 story 9 computes from the seat's folders and model Accounts are asserted here against real reads, and the health API reports, per seat, linked file types its model cannot read and file chips still untested for Doctor (epic 9 story 8); the injection pack gains poisoned PDF, image and text files in a linked folder."
