[[entry]]
id = 18
type = "story"
title = "Local search: bundled SearXNG, supervised, reachable only by the app"
description = "Owner principle Open by default (2026-11-18; arch AD-45, Local search service constraint): `xtask bundle-services` builds services/searxng/ for macOS arm64, the only v1 target (owner, 2026-11-19; arch AD-47) (python-build-standalone CPython installed by a pinned uv with only-managed Python, a virtualenv with SearXNG installed from its source tree at a pinned upstream commit, hash-locked Python dependencies, Granian 2.8.8), writes the tree's sha256 into a manifest compiled into the binary, and attaches the SearXNG source archive and licence to release artefacts; crates/am-services implements the LocalService port: verifies the tree hash, writes settings.yml into the owner-only state folder (<OS app data>/agentic-manager/services/searxng/, 0700; on macOS the Python helper's App Sandbox container, final review 2 security H5, 2026-11-19) with json the only output format, autocomplete off, safe search 1, limiter, public_instance and image_proxy off, request timeout 3 s, the default engine list and outgoing.proxies at am-net's new loopback CONNECT proxy for local services (CONNECT only to port 443 on the enabled engines' hosts, pinned resolver, blocked private, link-local and metadata addresses, a configurable minimum delay per engine host, default 2 s, byte cap, audited); generates the secret key into the keychain and passes it only as SEARXNG_SECRET; launches Granian on SearXNG's WSGI app on an owner-only Unix socket with no TCP listener, with a scrubbed environment (only SEARXNG_SETTINGS_PATH, SEARXNG_SECRET, PYTHONNOUSERSITE, PYTHONDONTWRITEBYTECODE, HOME and TMPDIR in its state folder, platform minimum), stdio only, its state folder as working directory; supervises it (readiness within 20 s, a health probe every 60 s that sends nothing upstream, restart with backoff, stopped after 5 failures in 10 minutes with a Failure Inbox item, redacted rotated logs); exposes status (running, version and commit, last health check, restarts, suspended engines) through the health API for Doctor (9.8) and Settings › Search (12.6); `agentic search status|restart|remove`; the tree changes only inside an app release through the verified, consented app updater; there is no separate update command or download (final review 2 security M3, owner delegated 2026-11-19); editing the engine list is privilege-widening (epic 4 story 17); SearXNG's request logging is off and the supervisor drops any log line holding the query; the socket path (run/s.sock) is checked against the 104-byte sun_path limit; the Python executable is signed as an App Sandbox helper (app-sandbox and network.client; story 4.16's signing step), and if the failing-first probe shows the bundled Python or Granian cannot run under the App Sandbox, it runs without it, the plan and docs/crate-notes/searxng.md record why, the About page states the residual risk and the isolation case below asserts the compensating controls instead; remove deletes the state folder and the keychain secret. Owner step: none. It proves whether SearXNG's HTTP client honours the proxy and records it in docs/crate-notes/searxng.md; whether the tree runs on Windows is a v1.x question (arch Deferred)."
verify = "Written first, failing (crates/am-e2e/tests/trust/local_search_*.rs; CI on the macOS arm64 runner, with am-services' unit tests against a fake service tree also passing in the Linux portability job): (supervised restart) killing the SearXNG process makes the supervisor restart it and the health API return running within 30 s, and a fixture tree that crashes on start is stopped after 5 failures with a Failure item and Doctor red; (loopback-only and secret) the process has no TCP listener and its socket file is 0600 in a 0700 folder; the secret key is in the keychain and absent from settings.yml, logs and the journal (canary scan); (scrubbed env) a canary environment variable set on the app and the app data dir's path appear nowhere in the child's environment (read back by a fixture engine plug-in), and, under the App Sandbox, the child cannot open a fixture file in the project or the app data dir (EPERM), or, if the plan records that the App Sandbox could not be used, the test asserts instead that the child's environment, cwd and argv hold no project or app-data path and that the About page's residual-risk sentence is present, so the case can pass either way; (updates only by app release) no API route, CLI command or setting installs a SearXNG tree, and a tree placed beside the bundle by a fixture is refused by the manifest check; (engine list) adding an engine through the API without the confirm token changes nothing; (no query text) after ten fixture searches the state folder's logs contain none of the query strings; (socket path) a fixture home path long enough to push the socket past 104 bytes leaves Local search stopped with the Doctor sentence naming the limit; a modified tree file makes start refuse with the Doctor sentence; (egress) with the proxy configured, a fixture engine pointed at a non-listed host and at 169.254.169.254 makes zero connections, two queries to one engine are at least the set delay apart, and every connection is audited — or, if the HTTP client ignores the proxy, the test records that and the About page's declared-not-enforced sentence is asserted instead; (remove) remove leaves no state folder and no keychain entry."
covers = ["R18"]
after = [2, "2.2", "2.5", "4.16", "4.17"]
hitl = false
risk = "high"

