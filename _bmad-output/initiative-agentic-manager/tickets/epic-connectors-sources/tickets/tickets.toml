# Epic 12 — Connectors and Sources (split from epic 9 on 2026-11-18). Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>'.
# Former epic 9 entries: 9.1 -> 3, 9.2 -> 4, 9.3 -> 5, 9.4 -> 6, 9.15 -> 10, 9.14 -> 11 (texts kept, extended for connectors).
# 2026-11-18 owner decisions: entry 17 (Rendered Reader) added after 7 in build order; entry 12 rescoped to a Firecrawl-compatible endpoint, self-hosted by default.
# 2026-11-18 Open by default and built-ins: entry 18 (Local search, SearXNG bundled and supervised) builds before 3; 19 (capabilities and provider swap) and 20 (local OCR) after 11; 3, 4, 6 and 16 restated.
# 2026-11-19 owner answers: entry 21 (Local OCR service as the OCR provider, e.g. PaddleOCR) builds after 19; 11 reads pptx; 15 waits on 21.
