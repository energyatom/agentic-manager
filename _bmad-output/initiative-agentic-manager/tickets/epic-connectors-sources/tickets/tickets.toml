[[entry]]
id = 10
type = "story"
title = "Link lists in a Local Repository are read once"
description = "Local Repository folders accept link lists (owner statement B, 2026-11-18; arch AD-30): links.txt (one URL per line, # comments), .url and .webloc files and the links-<timestamp>.txt lists the Agent card's Paste links… writes are recognised, claimed by sha256 like any drop file and parsed in the extract child (at most 50 URLs, http or https only; more or another scheme is a worded refusal for that line); the load fetches each URL once through the HTTP Reader (`Fetcher`, robots.txt respected) within the owner seat's allow-list with the size and redirect caps, stores each page as an untrusted record labelled with its URL, and those URLs count as recorded for the steps that read the records under the tainted-read rule; a URL whose host is not on the allow-list or resolves to a blocked address is not fetched, is named in the run log and is returned by the API as the seat's skipped hosts (shown on the Agent card with Allow host…); the list is deleted, archived or kept by the folder's policy only after the load committed; the injection pack gains a poisoned link list and a page in it that orders a fetch of another URL. Moved from epic 9 story 15 on 2026-11-18 and run as a Local Repository load (arch AD-30, AD-39)."
