title = "Sample and fixture Sources load end to end"
description = "Closing end-to-end story: epic 1 story 5's Company A Source files (t1-drop Local Repository into Table T1, D1's team Knowledge) and the synthetic fixture Sources over the loopback fixture site (fixtures/sites/: a built-in Crawler, a built-in Crawler with rendering on for script-built pages, a Feed and an API Source, owned by D1-E1) validate and load through the generic loader; on FakeLlm with recorded fixtures the golden run loads them, F2's update step reads only Table T1's new or changed rows, D1's branches in F1 read only new or changed records, and a second simulated week reads only that week's changes; the injection pack runs every connector case, including a poisoned record carried across the D2 → D1 hand-off; and (written first, failing; Open by default, RULE-20) a zero-key golden run: on a fresh project with only a fixture local model server (an OpenAI-compatible loopback fixture standing in for LM Studio), an empty keychain and no Accounts, the Company A sample with every seat switched to the local model runs Flow F1 end to end, including a web search step answered by the bundled Local search against the recorded engine fixture, and reaches the Owner's gate with lineage; and flow F3 (written first, failing; folder access, 2026-11-19) runs over the sample folder on FakeLlm with recorded provider file responses: each pattern's files reach their seat, the unrouted docx is listed to D1-Head, and the digest names a known word from every routed file; owner steps: run Test connector on each Source the owner configures for the owner's own departments and record robots.txt results and the terms check, run one real rendered load in the owner's installed browser within its page budget and, only if a site still fails to render, set up a self-hosted Firecrawl-compatible endpoint and record that decision."
verify = "CI: the zero-key golden run passes with zero keychain reads that return a key, zero requests to any keyed provider host and a web_search result in the run; `agentic validate` passes on the sample and the fixtures with all their Source files and the denylist scan finds no sample or fixture name in crates/ or web/; the two-week golden run on FakeLlm shows week 2's inputs equal to the fixture's changed records only, and the ledger shows the recorded service spend; F3's digest names a known word from every routed file and lists the unrouted docx; the injection pack's connector and folder cases yield zero outbound calls, zero approvable proposals and zero canary-bearing requests; the owner's record in docs/dogfood-log.md lists each of the owner's Sources' Test connector result, the robots.txt and terms checks, the owner's rendered load (pages, requests refused, time) and, if one was set up, the crawl endpoint's load against its reservation."
