# MCP lane (5–7) shares am-mcp; Doctor lane (8, 9) shares the health module.

[[entry]]
id = 5
type = "story"
title = "Add an MCP server after seeing its exact spec"
description = "Settings › Tools & MCP (spine-only; the Connectors catalogue's MCP card opens it) adds a server record to tools.yaml with command, args, env var names, cwd (the workspace), pinned version and declared network use; the add dialog shows all of them before Add, and Add is privilege-widening; approval stores the hash of the spec and its tool descriptions; its tools reach no seat until assigned in the seat sheet, default to external-effect, and assignment or lowering a class goes through the privilege-widening confirmation; the declared network use appears in each assigned seat's What this seat can touch panel. Matches key-mcp-add.html."
verify = "Playwright: adding a fixture stdio server shows the exact command, args, env names, cwd, pinned version and network use; Return keeps current access and writes nothing; after approval the server is in tools.yaml with no secret and its hash stored; no seat can call its tools until one is assigned through the confirmation; the seat's panel then lists the declared network use."
covers = ["R5", "R8"]
after = ["5.9", "5.12", "5.13"]
hitl = false
risk = "high"
references = ["ux-agentic-manager/mockups/key-mcp-add.html", "ux-agentic-manager/EXPERIENCE.md MCP server add"]

[[entry]]
id = 6
type = "story"
title = "MCP servers run scrubbed, pinned and untrusted"
description = "The am-mcp adapter (rmcp behind McpClient) launches stdio servers as children with an environment holding only the listed variables (values from the keychain where named, each registered with the redaction layer before launch), every inherited file descriptor but stdio closed, no path to the app data dir, `.agentic/workspace/mcp/<server-id>/` as cwd (never the project root; arch AD-26, defined 2026-11-19) and the pinned version, kills them with their process group on Stop everything, refuses CLI-class decisions from the CLI (Review, Question, Dismiss, Leave stopped, run start, schedule resume) while any stdio server is enabled, printing `agentic open --item <id>` (arch AD-15, amended 2026-11-18), and calls streamable-HTTP servers through the egress client; results are UntrustedData; the RULE-13 suite and MCP injection cases are written to fail first."
verify = "rule_13 trust tests: a fixture server that dumps its environment sees only the listed variables and no key, and holds no open file descriptor beyond stdio; a canary value passed in a listed variable and echoed back by the fixture server is redacted in the journal, audit log, trace export and drill-down (final review F5); the same fixture server reading the app data dir and `.agentic/` and posting Proposal apply, Approve once, Raise once and, with itself enabled, schedule resume through the CLI token finds no session secret and is refused every time, audited (final review F2, epic 4 story 3's harness); its cwd is .agentic/workspace/mcp/<server-id>/ and a relative write to seats/d1-e1.md lands inside it, not in the project; an unpinned or mismatched version refuses to start; Stop everything leaves no child process; an HTTP server's call to an unlisted host is blocked; poisoned MCP tool results yield zero outbound calls and zero approvable proposals."
covers = ["R6", "R12"]
after = [5, "4.4"]
hitl = false
risk = "high"

[[entry]]
id = 7
type = "story"
title = "A changed MCP tool description forces re-approval"
description = "On every connect the tool descriptions are re-hashed against the approval; a mismatch disables the server, raises a re-approval Inbox item showing the before and after descriptions, and keeps its tools unavailable until the owner re-approves through the privilege-widening confirmation; the RULE-13 rug-pull test is written to fail first."
verify = "A fixture server that changes one tool description on reconnect is disabled; the Inbox shows the re-approval item with the diff; a seat's call to that tool is refused until re-approval; after re-approval the new hash is stored and the call works; the trust test passes."
covers = ["R7"]
after = [6, "6.8"]
hitl = false
risk = "high"

[[entry]]
id = 8
type = "story"
title = "Doctor checks and the sidebar status"
description = "A health module runs the nine checks (Accounts reachable, connector Accounts such as a crawl-service endpoint included, keys present in the keychain, MCP servers connected with matching hashes, Sources (each failing Source or Source missing its Account, and 'No browser for rendering' with how to install Chrome, Chromium or Edge or set its path when a Source renders, from epic 12 stories 14 and 17's health API, with Open Source or Add Account), disk space, schedules with next fire and paused reasons, search (Local search: running, version and commit, last health check, restarts in 24 h, suspended engines, with Restart Local search; or the chosen provider's Account), file reading (each seat whose linked folders or folder routes hold a type its model does not read, and each claimed file chip still untested, with Choose a model… and Test this model, from epic 12 story 22's health API; replaced the local OCR check 2026-11-19, owner folder-access direction), blocked egress count and hosts from the audit log, keys found in project files) on open and on Check again; Settings › Doctor shows one row per check with dot, title and finding sentence; the sidebar foot reads 'Doctor · all good' or 'Doctor · N issues'. Matches key-models-doctor-history.html §2."
verify = "Fixture project with Local search stopped after repeated failures, a canary key in seats/d1-e2.md, one blocked call, a paused schedule and a failing Source: Doctor shows those five findings; a rendering Source with no browser found adds the 'No browser for rendering' finding with its fix (2026-11-18), and a stopped Local search shows 'Local search stopped after 5 failures' with Restart Local search, which brings it back to running (2026-11-18, Open by default) with EXPERIENCE.md's sentences and the other rows green; the sidebar foot reads 'Doctor · 5 issues'; removing the problems and pressing Check again turns it to 'all good'; visual snapshot matches the mockup in light and dark."
covers = ["R9"]
after = [7, "12.14", "12.18", "12.22"]
hitl = false
risk = "medium"
references = ["ux-agentic-manager/mockups/key-models-doctor-history.html §2"]

