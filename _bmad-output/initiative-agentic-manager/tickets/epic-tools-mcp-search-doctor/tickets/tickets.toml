[[entry]]
id = 5
type = "story"
title = "Add an MCP server after seeing its exact spec"
description = "Settings › Tools & MCP (spine-only; the Connectors catalogue's MCP card opens it) adds a server record to tools.yaml with command, args, env var names, cwd (the workspace), pinned version and declared network use; the add dialog shows all of them before Add, and Add is privilege-widening; for a stdio and an HTTP server alike, the confirmation states that its tools may run commands on this Mac and that agents given those tools could start processes, weakening the terminal-only guarantee for Account commands, and Add is never refused for that reason (owner, 2026-11-22, verbatim: \"MCP servers: warn, don't refuse. When adding any MCP server (epic 9), the confirmation states that its tools may run commands on this Mac, and that agents given those tools could start processes — weakening the terminal-only guarantee for Account commands (AD-13).\"; arch AD-13, AD-15, AD-26); approval stores the hash of the spec and its tool descriptions; its tools reach no seat until assigned in the seat sheet, default to external-effect, and assignment or lowering a class goes through the privilege-widening confirmation; the declared network use appears in each assigned seat's What this seat can touch panel. Matches key-mcp-add.html."
verify = "Playwright: adding a fixture stdio server shows the exact command, args, env names, cwd, pinned version and network use; the confirmation for that stdio server and for a fixture loopback HTTP server each states that its tools may run commands on this Mac and that agents given those tools could start processes, weakening the terminal-only guarantee for Account commands, and both can be added; Return keeps current access and writes nothing; after approval the server is in tools.yaml with no secret and its hash stored; no seat can call its tools until one is assigned through the confirmation; the seat's panel then lists the declared network use."
covers = ["R5", "R8"]
after = ["5.9", "5.12", "5.13"]
hitl = false
risk = "high"
references = ["ux-agentic-manager/mockups/key-mcp-add.html", "ux-agentic-manager/EXPERIENCE.md MCP server add"]

[[entry]]
id = 6
type = "story"
title = "MCP servers run scrubbed, pinned and untrusted"
