[[entry]]
id = 17
type = "story"
title = "Calculate & analyse: arithmetic, statistics and read-only SQL"
description = "Owner addition 2026-11-18 (built-ins; arch AD-46): the Calculate & analyse capability's tools, all read class, local, no network: `calculate` (a pure expression evaluator written in this repository: arithmetic, percentages, units and dates; no variables beyond the call, no loops, no I/O), `stats` (count, sum, mean, median, min, max, standard deviation and percentiles over given numbers or one column of a readable table) and `query_table` (one read-only SELECT through the AD-6 jailed reader over the `v_*` views of tables the seat owns or is granted, with row and time limits and dry-run rows excluded); each result is labelled with its inputs; free text read from rows stays UntrustedData; no arbitrary code runs (sandboxed code is v1.x). Limits (final review 2 security M6, 2026-11-19; arch AD-46): calculate accepts at most 1,000 characters, 64 levels of nesting, 1,000 digits in any intermediate value and integer exponents up to 10,000, within 100 ms; query_table uses the AD-6 allow-list authorizer and memory limit and also refuses any v_* view the seat is not granted."
verify = "Written first, failing: calculate returns exact results for a fixture table of expressions and refuses an expression with a function call outside its grammar, an import or a 10,000-level nesting with a worded error; stats over Table T1's numeric column matches a reference computed in the test; query_table returns D1-E1's granted rows from Table T1 and refuses INSERT, UPDATE, DELETE, ATTACH, PRAGMA and a second statement, a table D1-E1 is not granted, and a query past the time limit; with Calculate & analyse off the three tools are absent and refused; a row whose text holds an injection string reaches the model only fenced. 10^100000, a 2,000-digit product and a 5,000-character expression are each refused with a worded limit; query_table on sqlite_master and knowledge_fts is refused; a pathological recursive CTE stops at the time limit and the memory cap."
covers = ["R16"]
after = ["12.19", "7.1", "8.1", 10]
hitl = false
risk = "medium"

[[entry]]
id = 18
type = "story"
title = "Files workspace, Memory and Hand-off & ask tools"
description = "Owner addition 2026-11-18 (built-ins; arch AD-46): Files workspace gives `workspace_read` and `workspace_write` (read and local-write) inside `.agentic/workspace/<seat-id>/` through WorkspacePath (owner-only, capped sizes, never deleted by the app; written files are listed on the Agent card and become step outputs only when a step declares them); Memory injects the seat's memory notes (AD-27) and gives `remember`, which creates a memory-note Proposal the owner applies (RULE-3; nothing is written without Apply); Hand-off & ask gives `ask_seat`: a question to a seat of the same department or one a declared hand-off connects it to, answered by a one-step run of that seat under its own caps and reserving also against the asker's run, seat, workflow and company scopes, with no ask_seat tool of its own and emitting no trigger events (final review 2 security M4, 2026-11-19), recorded as a lineage edge, the answer UntrustedData when the answering step read untrusted content; the same answer run serves epic 10's Ask a seat threads (10.6). Taint (final review 2 security H1 and H2, owner delegated 2026-11-19; arch AD-10): workspace files carry their writer's taint at rest and a workspace_read of a tainted file returns UntrustedData and taints the reader; a tainted step's workspace_write is limited to its declared workspace paths; a remember from a tainted step is a tainted-origin Proposal, never approvable; an ask_seat question from a tainted step reaches the answering seat fenced and taints its answer run."
verify = "Written first, failing: D1-E2 writes and reads back a draft in its workspace, a path outside it or through a symlink is refused, and another seat cannot read it; `remember` leaves the seat file unchanged until the owner applies the Proposal, after which History shows it; D1-E1 asks D1-Head through ask_seat and the answer arrives within the step, D1-Head's ledger shows the answer run, the lineage of D1-E1's output names D1-Head's answer, and asking a seat of another department with no declared hand-off is refused; with each capability off its tools are absent and refused. (taint, written first) a step that read the poisoned PDF writes notes.md in its workspace and a clean step of the same seat reading it a FakeClock week later is tainted with the text fenced; the tainted step's write to an undeclared workspace path is refused; its remember yields a tainted-origin Proposal that the API refuses to apply; its ask_seat question appears fenced in D1-Head's answer run, which is tainted; an answer run scripted to call ask_seat back to the asker finds the tool absent; the answer run's reservation appears under both the asker's run scope and D1-Head's seat scope."
covers = ["R17"]
after = ["12.19", "6.8", 10]
hitl = false
risk = "medium"

