[[entry]]
id = 19
type = "story"
title = "Recover Accounts after a lost user database"
description = "Owner, 2026-11-22, verbatim: \"The two medium gaps: have Sofia give each an owner story — recovery after a lost user database (likely Doctor, epic 9), and a clear rule for --as old=new under 'same ids' (2.13 is the natural home; decide it in the 2.13 plan).\" (arch AD-17 *Recovery*, AD-15 *Change* and *Key use*). A Doctor check and its fixes for the user store (`<app data dir>/user.db`, epic 2 story 12) when it is missing (am-app has created a new one marked `recovered`), unreadable (it cannot be opened or read), newer than this binary (its `user_version`) or not a user store (another `application_id`), while the user Accounts file lists Accounts and their Keychain entries remain. The check runs even when the store cannot be opened. The row names the state in words and lists each Account left with no live confirmation record, with its provider and host, saying its key is still in the Keychain and is not used until the Account is confirmed again. Fixes: for an unreadable store or one that is not a user store, Set aside… (UI class, refused while another process of this Mac serves or runs, naming it) moves `user.db` with its `-wal`, `-shm` and `-journal` files, each checked by sha256, into `<app data dir>/set-aside/<UTC timestamp>/` (an `AppDataLayout` path) under `user.lock` after a confirmation that names that path, never deleting them, and am-app then creates a store marked `recovered`, in which the user Accounts file is not read as an outside change until each Account's confirmation writes its first History entry (so `accounts migrate` carries nothing over into it); a newer store is never moved or written, and the row names the newer binary to use. For each unconfirmed Account, Confirm… opens the normal confirming path, epic 5 story 5's Account card (the CLI's `accounts change` is retired by then, arch AD-15 *Retirement*, and is not named), which is AD-15's first confirmation: the typed name, `yes` and a new key at the hidden prompt, replacing the entry by that rule. Doctor itself reads no key, sends no key and runs no Account test for an Account without a live record (the Key-use check refuses it before any Keychain read), deletes no file, store or Keychain entry, and confirms nothing itself; no Undo, import, Assistant patch or CLI-token route confirms an Account here."
verify = "Written first, failing, with FakeSecretStore recording every call, a canary key and a temporary HOME whose user Accounts file lists two keyed Accounts with their Keychain entries: (a) with `user.db` removed, the Doctor row shows the missing-store finding listing both Accounts as unconfirmed with provider and host, the new store is marked `recovered`, FakeSecretStore records no call on an Account's entry (from story 10 every writer open also reads the project's backup key, which this count leaves out; 2026-11-24), and `accounts test` and a run refuse each Account before any Keychain read; after Confirm… (first confirmation with a new key) that Account sends and the other is still refused; (b) with `user.db` replaced by bytes that are not a database, and (c) by a project store (another `application_id`), the row offers Set aside…, which after its confirmation leaves the original files (with a `-wal` file holding uncheckpointed rows in the fixture) at the named path with equal sha256s, no `-wal` or `-shm` beside the new store marked `recovered`, and is refused naming the process while a second fixture process serves; (d) with a newer `user_version`, the row names the newer binary, offers no Set aside, and the file's bytes are unchanged; in every case nothing is deleted (no file or store is removed, and FakeSecretStore records no delete or set of an Account's entry before that Account's own confirmation), the canary appears in no output, log, History or audit, and Check again turns the row green only once every listed Account has a live confirmation record; visual snapshot of the row matches the Doctor mockup's row pattern in light and dark."
covers = ["R9", "R10"]
