[[entry]]
id = 13
type = "story"
title = "Runtime folder outside the project"
description = "Arch AD-32, AD-16 and AD-7 (amended 2026-11-20, architect REPLAN; restated 2026-11-21, Sofia REPLAN with the owner's decisions of that day; owner: runtime state never lives inside a cloud-synced folder, one Mac at a time through a marker file). `am_domain::RuntimeLayout` names every runtime path and CI fails on the literal `.agentic` in crates/ outside it; am-app's platform adapter resolves the runtime base (`~/Library/Application Support/agentic-manager-projects/` on macOS, `$XDG_DATA_HOME/agentic-manager-projects/` elsewhere so the Linux job runs) and am-store opens the runtime folder it is given. Identity: am-app's `ProjectIdentity` port (AD-47, with an am-testkit fake) reads the root's volume from the folder's device (`/usr/bin/stat`, then `/usr/sbin/diskutil info -plist <device>` for its VolumeUUID; never `diskutil` on `/`), its file id, and the Mac's name (`/usr/sbin/scutil --get ComputerName`), each by absolute path with a 10-second limit; off macOS it reads device and inode from std metadata and the name from `/proc/sys/kernel/hostname`; when a tool fails, times out or returns output without the expected value, the open is refused in words naming the tool and what it returned, and no id is ever guessed or filled in from a fallback (owner decision 2026-11-21; the store's lock-record host comes from the same port, replacing `host_name()`'s fallbacks); a volume with no VolumeUUID (a network share) is refused in words as not supported in v1. This Mac's id is a random UUID minted once in the app data dir, never a hardware id (owner decision 2026-11-21: `ioreg` is not used). Each runtime folder records its root's identity in a `RuntimeLayout` file, which is authoritative; the base's root index is a cache rebuilt from those records; one am-app module writes both, record first, by temp file and rename; a root is gone only when its volume is mounted and its file id absent. Resolve order: identity read first, then under the base's lock (identity re-checked) `project_id` read and the root looked up in the index; a legacy `<project>/.agentic/` is handled next (below); a root not in the index with no `project_id` gets a UUIDv7 minted, its runtime folder created (0700, files 0600), its root recorded, its store opened, and then `project_id` written by a `ConfigIdentityAssign` from `Actor::System(runtime)` that inserts only the `project_id` line after `schema_version` and leaves every other byte of company.yaml as it was (owner decision 2026-11-21; story 8's writer canonicalises, so this targeted write is new here), committing History and audit only, never an approved grant set (AD-16). `agentic validate` never writes one, and `agentic validate --template` (which `just validate` runs over templates/ and fixtures/) refuses one (owner accepted 2026-11-21). `agentic serve --project` on a folder with no `company.yaml` is refused in words naming the first-run wizard (epic 5 story 16 owns creating a project and replaces this refusal), and one holding config files but no company.yaml is refused in words. A copy (the id's runtime folder records another mounted root still holding that id) is refused naming both folders and offering, in words, \"treat this as a new project\": remove `project_id` from the copy's company.yaml and open again (owner decision 2026-11-21; the CLI only words the fix because the CLI class makes no config edit; the one-step button is epic 5 story 19). A root gone from a mounted volume is a move, recorded and audited. A recorded root on an unmounted volume is refused until `agentic serve --project <path> --confirm-move` on an interactive TTY, which asks with No the default and only re-points that root to its own runtime folder. A root in the index whose `project_id` is now absent or different is refused naming both ids and the fixes in words (write the indexed id back, or treat it as a new project), never minted over and never fixed by `--confirm-move` (arch AD-32, 2026-11-21: a hand-edited id must not adopt another project's state). `--take-over` and `--confirm-move` stay terminal-only in this story (owner decision 2026-11-21; the UI's equivalents are epic 5 story 19) and are refused naming the UI while the project's config enables a stdio MCP server or a Source with `render: true`. Legacy folder (owner decision 2026-11-21: kept, never deleted): a `<project>/.agentic/`, with or without a state.db, is checked before the mint and before any store opens; its lock is taken (refused while held), its state.db copied with VACUUM INTO into the runtime folder as that folder's store (a fresh store when it has none) and every other file copied and checked by sha256, under a move journal with the sha256 manifest that the next open resumes after a crash; then the old folder moves out of the project into the runtime folder as `legacy-agentic-<YYYY-MM-DD>/` (UTC; `-2`, `-3`… when taken, the free name chosen under the lock) by a rename, or by a sha256-checked copy after which the project's copy is removed when the rename fails or the project lies under `~/Library/CloudStorage/` or iCloud Drive; the kept folder gets 0700 and files 0600, is exempt from every sweep and retention walk, and is never deleted by the app; the open is reported like a migration, naming the kept folder, saying it still holds data later deletions do not reach and that the owner may delete it by hand. Every file copy in this story reads and writes the bytes (a stream copy), never `std::fs::copy`, whose first step on macOS is `clonefile(2)`: that call returns EPERM for a file under `~/Library/CloudStorage/` that carries no `com.apple.macl` grant for the calling app, while plain reads succeed (evidence 2026-11-21, epic Notes); the test helpers that copy fixtures (am-config tests/common and validate.rs, am-e2e config_history.rs, cli_validate.rs and spike c4, xtask denylist.rs) switch to the same stream copy. An unverified copy leaves the old folder untouched and refuses the open; a legacy folder beside a runtime state.db this move did not write is refused naming both. Pre-migration backups move to `backups/pre-migration/` with only the three newest kept (AD-7 unchanged: the owner answered 2026-11-21 that backup copies are not covered by \"nothing about user data is removed automatically\"). The `.agentic-open` marker (Mac name, this Mac's random id, pid, opened-at) is written at open and removed at clean close only when its id, pid and opened-at are this process's own; markers are compared by this Mac's id; another Mac's marker refuses the open naming it until `--take-over` on an interactive TTY, a marker from this Mac with a gone pid is replaced and one with a live pid is refused naming the holder; the Blank template's and the Company A sample's `.gitignore` list it (the offer to add it to another project's .gitignore is epic 5 story 19 and epic 9 story 8). Shipped reference files leave `.agentic/` (arch AD-32, 2026-11-21): `templates/samples/company-a/.agentic/knowledge/team-d1/` moves to `templates/samples/company-a/runtime-seed/knowledge/team-d1/` and `fixtures/projects/anatomy/.agentic/knowledge/full/` to `fixtures/projects/anatomy/runtime-seed/knowledge/full/`; the repo `.gitignore` exceptions and docs/config-schema.md follow; `agentic validate --template` checks knowledge entries against `runtime-seed/`, and validate on a project checks them against its runtime folder or, without one, skips the existence warning (copying seeds into a runtime folder at apply is epic 4 story 11 and epic 5 story 12)."
verify = "Written first, failing (am-store, am-config and am-app serve tests with HOME set to a temp folder; identity through the am-testkit fake or a stub-tool adapter built by constructor parameter, never a flag or env var): a new project opened by `agentic serve --project` gets `project_id` in company.yaml as one inserted line with every other byte (comments and key order) unchanged, one History entry and one `config.edited` audit by System(runtime), no approved grant set, and a runtime folder under the temp runtime base holding lock, state.db and its root record, with nothing else written in the project but `.agentic-open`, which is gone after a clean stop and holds no hardware id; a copy opened while the original exists is refused naming both folders and offering to treat it as a new project, and after removing its `project_id` opens with a new id and an empty runtime folder; a moved project opens, records its new root and audits the move; a root record naming an unmounted volume is refused until --confirm-move; an indexed root whose `project_id` was changed or removed is refused naming both ids, no id is minted and --confirm-move does not open it; a fixture with a legacy .agentic/ whose state.db holds rows opens with the rows, no `.agentic/` left in the project, the legacy files intact under the runtime folder's `legacy-agentic-<date>/` with modes 0700/0600 and the report naming that folder and saying it may be deleted by hand; a legacy folder holding only reference files moves the same way with a fresh store; a crash injected after the copy resumes the move on the next open; a legacy file that refuses `clonefile` (a fixture whose clone step is made to fail) is still copied and verified; one whose legacy lock is held is refused and one beside a runtime state.db it did not write is refused naming both; five successive migrations leave exactly three files in backups/pre-migration/; a marker naming another Mac's id refuses the open naming it and --take-over opens, a marker with this Mac's id and a live pid is refused, and a clean close leaves a marker that is not its own in place; an identity tool that fails, hangs past 10 s or prints output without the expected key refuses the open naming the tool, with nothing written; an empty folder is refused naming the first-run wizard, with nothing created; `agentic validate --template` refuses a `project_id` and `just validate` passes on templates/ and fixtures/ with no `.agentic/` left in either and the moved seed files found under `runtime-seed/`; story 6's and 7's tests pass against the new layout; the CI check fails on a `\".agentic\"` literal added outside RuntimeLayout; `just check` is green on macOS and the Linux job builds and passes nextest."
covers = ["R4", "R9"]
after = [8]
hitl = false
risk = "high"

[[entry]]
id = 9
type = "story"
title = "Outside edits wait for Reload"
description = "A notify watcher raises ConfigChangedOnDisk with the file's diff when a project file changes outside the app, ignores the app's own writes by their fingerprint, keeps the current snapshot until a Reload command applies the new one (recorded in History as an outside edit), and reports an invalid outside edit with file, line and fix instead of applying it. epic-org-seats-ui renders the banner and Show diff. Epic 4 story 18 (2026-11-19, final review 2 security H4) holds a Reload or startup load that widens access until the two-step confirmation; this story's single-click Reload stays for every non-widening edit."
verify = "Editing a seat file in another editor raises exactly one changed-on-disk event with its diff and the snapshot hash is unchanged until Reload; after Reload the new hash is live and History shows the outside edit; the app's own write raises no event; an invalid outside edit is reported and not applied."
covers = ["R2"]
after = [8]
hitl = false
risk = "medium"

