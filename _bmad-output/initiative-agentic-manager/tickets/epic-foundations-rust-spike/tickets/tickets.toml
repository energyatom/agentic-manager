# Epic 1 — Foundations and Rust spike. Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>' (final review coverage F8).
# Story 1 is the owner-directed two-week spike; every later entry waits on its verdict (directly or through its lane).

[[entry]]
id = 1
type = "spike"
title = "Stack spike: nine criteria and a verdict"
description = "Answers whether the Rust-first stack holds: proves the nine stack-spike criteria inside the real workspace behind the real ports (every Structural Seed crate scaffolded, justfile, minimal CI on macOS arm64 with the Linux portability build of the core, arch AD-47), each as a runnable test or recorded demo, and writes the spike report (repo docs/spike-report.md, summarised as a dated Decision in this epic's Notes) with a verdict per criterion plus the pinned toolchain, the OpenAI cloud API choice, Ollama loaded-context field and any unsafe exception; every later story, epic 2 and epic 3 wait on it, and two or more failures among criteria 1-7 and 9 open the REPLAN (arch AD-2). What the owner provides for the spike (START-HERE 'What you provide for the spike'; restated 2026-11-19, final review 2 consistency H1): (1) an empty GitHub repository and push access; (2) an Anthropic API key (criterion 1: proves frontier-model streaming, tool calls and cancellation; an OpenAI key or any other OpenAI-compatible cloud key is an accepted alternative, owner 2026-11-19, in which case the Anthropic adapter passes on recorded fixtures and runs live in epic 2 story 5); (3) LM Studio and/or Ollama on the Mac with one tool-capable model loaded (criteria 1 and 9); (4) Node.js (for npx) and uv (for uvx) installed, and nothing else for criterion 5: Claude Code launches two official MCP reference servers, free and with no account (owner, 2026-11-19; stack-spike.md 'Criterion 5'): over stdio `npx -y @modelcontextprotocol/server-filesystem@2.4.0 --read-only <throwaway test folder>` (a folder the spike creates under the system temp directory with one fixture file; alternative `uvx mcp-server-fetch@2026.11.18`), and over Streamable HTTP `npx -y @modelcontextprotocol/server-everything@2.3.1 streamableHttp` at http://127.0.0.1:3001/mcp; (5) a local folder outside the repo holding a few of the owner's files of mixed types (for example a PDF with a text layer, a scanned PDF, an image, a spreadsheet, a Word or PowerPoint file and a csv), its path set in the environment variable AM_SPIKE_DOCS_DIR, and, for criterion 4's local half, one vision-capable model loaded in LM Studio or Ollama (criterion 4; owner decisions 2026-11-18 and 2026-11-19, folder access); (6) the sleep/wake demo, closing the lid across a scheduled fire (criterion 3); (7) not for the spike: the Apple Developer ID certificate and notarisation credentials and a clean Mac come later, when the owner readies the app for outside use (criterion 8). Criterion 8 is deferred (owner, 2026-11-19): the spike records it 'deferred: Apple Developer account', keeps an ad-hoc-signed Tauri build that links the core and launches and serves the UI as stand-in evidence, and leaves it out of AD-2's two-failure count, which is judged on criteria 1-7 and 9; the signed and notarised clean-Mac demo becomes a gate before v0.9-rc, run at the start of epic 11 story 3. Criterion 5 may be recorded 'pending owner input' only while Node.js or uv is not installed; a pending criterion is not a fail, and Claude Code continues with the other criteria instead of stalling. Criterion 4 (rewritten 2026-11-19, owner folder-access direction: 'Files to models'): the folder-access tool links AM_SPIKE_DOCS_DIR read-only, lists it and reads every file under the confinement rules (a canonicalised grant root, symlink escapes refused, no write), and attaches each file through LlmProvider file parts to (a) a frontier model (the Anthropic key's model, or the OpenAI Responses API on an OpenAI key) and (b) the local vision-capable model; the report records per file type and model whether it was accepted natively or refused (with the worded refusal, made before any request), tokens and cost; it is skipped in CI when the path is not set, and CI runs it on small synthetic fixtures under fixtures/ against recorded provider responses; no per-format parser and no OCR is part of the spike (arch AD-1, AD-30, AD-31)."
verify = "The spike report lists all nine criteria, each with pass or fail (criterion 5 may read 'pending owner input', criterion 8 reads 'deferred: Apple Developer account') and a link to its test or recorded demo; the spike creates a minimal `just check` (cargo fmt --check, clippy -D warnings, cargo nextest run) and it is green on the spike workspace, story 2 hardening it into the full gate (green before story 2 means exactly this minimal `just check`); with two or more fails a REPLAN entry is in the initiative's Notes before epic 2 starts; criterion 4 shows the owner's recorded run over every file in AM_SPIKE_DOCS_DIR with a per-file, per-model table (accepted natively or refused, tokens, cost), every accepted type's answer naming a known word from the file, every excluded type refused with zero bytes sent, and the confinement cases (a symlink leaving the folder, a ../ path, a write attempt) refused, its test reports 'skipped: AM_SPIKE_DOCS_DIR not set' in CI, and the committed fixtures are synthetic or public domain (none of his documents is in the repo). Criterion 5 shows rmcp listing tools on both servers, `read_text_file` on the stdio server returning the throwaway folder's fixture text and `echo` on the Streamable HTTP server returning its message, or is recorded 'pending owner input' naming the missing Node.js or uv; criterion 8 is recorded 'deferred: Apple Developer account' with the ad-hoc-signed launch as stand-in evidence and epic 11 story 3 named as its gate, and the REPLAN count lists criteria 1-7 and 9 only."
covers = ["R6"]
after = []
hitl = true
risk = "high"

