[[entry]]
id = 14
type = "story"
title = "Seat host allow-lists, cloud folder roots and the one glob matcher"
description = "Arch AD-48, AD-30, AD-4 and the Globs convention (amended 2026-11-20, architect REPLAN). `am_domain::HostPattern` parses a lowercase ASCII host (internationalised names in their xn-- form) matched exactly, or `*.` plus a domain of at least two labels matching any subdomain depth but not the bare domain, admits https:443 and http:80 only, refuses a scheme, port, path, IP literal, localhost, non-ASCII text and other wildcards, and answers `covers`. A seat file's `allowed_hosts` is validated with file, line and fix and becomes the seat's allow-list in the snapshot, replacing story 12's interim rule; link-host warnings and Source scope hosts (each covered by the owner seat's patterns) use it; Account endpoints are not added to it. One ConfigMigration through story 10 moves `tools.yaml` `egress_hosts` into the `allowed_hosts` of each seat that can fetch (Web search, Browse & read pages or Crawl on, or owning a Source) and no other, lists and drops entries HostPattern refuses, and removes the key, as a diff written only on accept with the old snapshot in force until then; the Company A sample and fixtures carry `allowed_hosts` and no `egress_hosts`, and role templates carry none. The folder-root policy allows folders at or below `~/Library/CloudStorage/<provider>/` and below `~/Library/Mobile Documents/com~apple~CloudDocs/`, keeps refusing ~/Library, ~/Library/CloudStorage itself, other Mobile Documents containers, the app data dir, the runtime base, any folder that is, contains or lies inside another recent project's root, and the open project's root and every folder above it; inside the open project (restated 2026-11-22, owner decision \"Option 1: amend AD-30\"; arch AD-30) a subfolder may be linked read-only only when it holds no config file, while the config folders (seats/, workflows/, tables/, schemas/, models/, skills/, sources/ and every other folder the loader reads config from), `.agentic`, `runtime-seed/` and `.agentic-open` stay refused, any `read_write` access inside a project root is refused, a symlink leaving the linked subfolder is refused, and a linked project subfolder that later gains a config file fails `agentic validate` at the seat's folder line; the Company A sample's `files/d1-inputs` link is unchanged. A new leaf crate `am-glob` (globset and unicode-normalization only, added to the AD-4 matrix and `cargo xtask check-deps`) is the one glob matcher: literal_separator(true), pattern and subject NFC-normalised, linked-folder include/exclude case-insensitive against the root-relative path, Source URL-path scopes case-sensitive, and a regex form for crawl services; am-config's validator moves onto it."
verify = "Written first, failing: HostPattern table tests (docs.example.org exact; *.example.org matches a.b.example.org and not example.org; *.com, 10.1.2.3, localhost, example.org:8080, https://x.org/, Example.ORG and a non-ASCII name each refused or normalised as AD-48 says; *.example.org covers docs.example.org and not the reverse); a seat with `allowed_hosts: [docs.example.org]` validates and one with `https://x.org/` fails at its line with the fix; a link to a host outside the seat's patterns warns and a Source scope host not covered by its owner seat warns; an Anthropic-model seat's allow-list does not contain api.anthropic.com; a fixture project with `egress_hosts: [docs.example.org, 10.1.2.3]` offers the migration as a diff listing 10.1.2.3 as dropped, changes no file until accept, and after accept only its fetching seats list docs.example.org and the key is gone; a folder under ~/Library/CloudStorage/OneDrive-Fixture/ and one under com~apple~CloudDocs validate while ~/Library, ~/Library/CloudStorage, ~/Library/Mobile Documents/com~apple~Pages and the project root each fail with file:line and fix; a read-only project subfolder holding no config file validates, while the same subfolder linked `read_write`, a config folder (`seats`), `runtime-seed/`, a folder above the project root and a linked subfolder that has gained a config file (a seat file copied into it) each fail with file:line and fix; the Company A sample's `files/d1-inputs` still validates; `*.PDF` matches Report.pdf as a folder include and not as a URL scope, and an NFD file name matches its NFC pattern; `cargo xtask check-deps` accepts am-glob's edges and refuses an am-glob dependency on am-domain; agentic validate passes over templates/ and fixtures/."
covers = ["R11", "R14"]
after = [10, 12]
hitl = false
risk = "high"

