description = "Re-sliced 2026-11-24, three times (owner, verbatim in this epic's Notes): the store slice of the approved story 6 plan, built first (R8's row history; arch AD-6, AD-7, AD-10 (c), AD-21, AD-24). Adds migration 0010: the generic row store (`table_rows`: table id, row id, JSON data, version, taint), the append-only row history (`row_history` whole-row after-images naming the Actor and, for a seat, run, step run, seat and call sequence, the step run and call sequence unique), the attempt's journaled seat and declared table on `step_runs` (the shipped engine leaves them empty until story 23 fills them), and append-only triggers (no delete or replace of a row, a version that steps by one, a taint that only rises, no row change without its after-image, history never updated, deleted or replaced). Adds the writer's row write command with an explicit Actor (insert, or update at an expected version; no delete), the only way a row or its history is written (there is no separate history-write command: the after-image is written only inside it), which checks the write against the journal (a Seat actor of the attempt, the attempt running, an issued tool call at its key, the attempt's declared table) and in one transaction writes the after-image, then the row, finishes the tool call and audits ids, version, counts and taint, never row data. Each row stores its own taint on write, the higher of the attempt's committed taint, the write's and the row's, so a row written by a tainted step is marked tainted at rest and a row's taint only rises. An update made against a stale version is refused in words naming the row id and its current version; nothing changes, and the old version stays readable from the history and as the current row. Owner condition: nothing in shipped code calls the row write command until story 23 lands, enforced by a `cargo xtask check-deps` rule that names the command only in am-store, its `#[cfg(test)]` items and its tests; story 23 widens it to the engine's port implementation alone. Store-level tests only: the port, the tool, ToolGate, idempotent replay and the `table:` key are story 23."
