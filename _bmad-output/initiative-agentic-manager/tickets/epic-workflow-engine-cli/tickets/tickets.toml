description = "Each model call reserves a ledger entry (counted prompt tokens plus max output tokens times price) and settles it from usage, or at the reservation when usage is missing, in USD and company-currency micro-units (the company currency defaults from the system locale) with the price file's rate snapshot; the shipped prices.yaml and models/prices.yaml carry an updated date; `agentic status` shows spend by step, run, seat, team and ISO week in company time; local calls show zero cost with tokens and time. No cap is checked (epic 4)."
