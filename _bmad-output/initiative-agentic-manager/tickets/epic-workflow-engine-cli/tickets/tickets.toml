description = "Re-sliced 2026-11-24, three times (owner, verbatim in this epic's Notes): the ToolGate slice of the approved story 6 plan, built on story 6's store and carrying the owner's Q1, Q2 at the tool, the `table:` half of Q3 and Q4's result conditions (R8's table_write binding; arch AD-8, AD-10, AD-11, AD-21, AD-46). ToolGate becomes the only tool path for every step: `table_write` lives in am-tools as a `RowTool` (its spec from the declared table's column ids and types, its argument and data checks in words naming config ids only), reached only through ToolGate, which is the only caller of the am-domain `RowWriter` port that am-engine implements over story 6's row write command. `table_write` is bound to the step's declared table (the new `table:` step key; `agentic validate` checks that the table exists, belongs to the seat's team, that the seat has the Tables capability on and that the step is not a gate step), is offered only to a step that declares a table, whose seat and declared table the engine journals on the attempt at its start (filling story 6's columns), and a call naming another table or another team's table is refused and audited; a stale-version update comes back to the model as an error result. It is idempotent by step run and call sequence: a repeated call writes nothing and returns the first write's result read from the journal, and a loop-back attempt's calls are new writes. A successful write comes back as an `EngineResult` that ToolGate alone builds from engine values (the row id, the version and a fixed status word), which does not taint; it is journaled as its own part kind on its tool call's journal row (AD-8), with a label naming the tool, in the same transaction as story 6's row write command, which this story extends, and a resume or drill-down rebuilds it from the writer's committed record of the call, never parsing it from journal text or tool output. Every error result stays UntrustedData and taints. Every other tool class stays