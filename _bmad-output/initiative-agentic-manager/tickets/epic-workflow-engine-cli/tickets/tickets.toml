description = "Closing end-to-end suite (arch AD-33, amended 2026-11-18): `just golden` runs Company A's flow F1 from templates/samples/company-a through the generic loader on scripted FakeLlm (one script per seat; only table_write (story 23) and write_document (story 20) called): D2-Head produces Document A, the hand-off to D1 fans out to D1-E1, D1-E2 and D1-E3, D1-Head consolidates at the fan-in, the hand-back reaches D2-Head, D1-Head's review gate returns once then approves, and the Owner's gate is answered by a scripted `agentic gate`; it snapshots tables, documents, ledger per branch, Inbox and the lineage of Report R1; golden variants cover a failed branch (policy ask), kill -9 mid-fan-out and a tainted row carried across the hand-offs; CI adds the 80% coverage gate on am-engine and am-store; `just golden-local` runs the same on a real local model. Owner step: run `just golden-local` on the owner's Mac with LM Studio and record the result. Until epic 4's ToolGate classes (4.8) and taint (4.9) exist, golden and golden-local expose only table_write and write_document to the model (a test-only tool profile masks the sample's other capabilities; final review 2 security M4, 2026-11-19); epic 4 story 13 runs the golden run with the full tool set. (2026-11-24, owner quality plan part 1, verbatim in this epic's Notes) This story completes story 24's `golden_so_far` test (`crates/am-e2e/tests/golden/`) into `just golden`: its expected stop point becomes the end of F1 and its snapshot the golden snapshot, and `just check` keeps running it on every PR."
verify = "`just golden` and its variants pass in CI and their snapshots of tables, documents, ledger per branch, Inbox and lineage match; the lineage snapshot names every contributing seat with its model and cost; CI fails a branch that drops am-engine or am-store below 80% coverage; the owner's `just golden-local` record shows every step schema-valid after at most one repair each. The golden-local run's journal shows only table_write and write_document offered to the model. `golden_so_far` runs F1 to its end with no expected stop point left, and `just golden` runs it (one test, not a second copy)."
covers = ["R11", "R13", "R14", "R15", "R16"]
after = [12, "1.5", "2.4"]
hitl = true
