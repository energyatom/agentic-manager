# Epic 3 — Workflow engine and CLI with the CLI gate. Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>' (final review coverage F8).
# Most entries form one lane: they share the agent loop in am-engine and the am-store migration sequence.
# 2026-11-23 owner decision: entry 19 (Backgrounded agentic serve keeps answering) added after 3, before 4; it waits only on 2, so 3 does not wait on it; 4 (shared am-app CLI and terminal code) and the sweep (12) wait on it.

[[entry]]
id = 1
type = "story"
title = "One-step run from the CLI on FakeLlm"
description = "Tracer bullet: `agentic run <workflow>` loads the config snapshot and pins its hash, writes run, step-run and model-call journal rows each committed before its side effect, drives one bounded agent-loop turn through LlmProvider on FakeLlm, stores the step's output, and `agentic status` lists the run, step, snapshot hash and duration from a read-only reader."
verify = "`agentic run` of a one-step fixture workflow on FakeLlm prints the run id and succeeds; `agentic status` shows the run, its step, its snapshot hash and duration; the journal holds the run, step-run and model-call rows with audit entries."
covers = ["R3", "R7"]
after = ["1.3", "1.4", "1.7"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Loopback server with launch-code sign-in"
description = "`agentic serve` binds 127.0.0.1 and keeps the per-launch session secret in memory only, never on disk (arch AD-13, amended 2026-11-18); opens the browser with a single-use 60-second launch code in the URL fragment exchanged for an HttpOnly SameSite=Strict cookie named for the port (`am_s_<port>`) plus a per-session CSRF value returned in the body and held in page memory; requires that value as X-AM-CSRF on every API request, GET included, and as the WebSocket subprotocol on the upgrade; prints an 8-character base32 pairing code as the fallback (5 attempts a minute, locked after 10 failures until restart; a failed launch-code exchange invalidates the code); checks the Host and Origin allow-lists on every request and the upgrade, sends no CORS headers, refuses loose permissions; writes a separate per-launch CLI token (0600, app data dir) that the CLI uses and that grants only the CLI class of arch AD-15, with every route tagged CLI class or UI class; serves /api/v1 run status with the one error envelope and a WebSocket event stream with seq and since=. The RULE-15 suite is written to fail first; the spike's criterion 6 tests are its seed."
verify = "`agentic serve` opens the browser signed in once; the rule_15 trust tests fail before and pass after: rebinding Host, cross-origin fetch, cross-origin WebSocket upgrade, a missing CSRF header on a mutation, a cookie-only GET (as another localhost service would send it), a cookie-only WebSocket upgrade and one with a wrong subprotocol, a replayed launch code and one older than 60 s are refused; the 11th wrong pairing code is refused even when correct until restart; the cookie name carries the port; a 0644 data dir stops the server; no URL, log line or file under the app data dir or `.agentic/` holds the session secret; the CLI token is refused on a UI-class fixture route; a reconnect with since= replays missed events."
covers = ["R12", "R7"]
after = [1]
hitl = false
risk = "high"

