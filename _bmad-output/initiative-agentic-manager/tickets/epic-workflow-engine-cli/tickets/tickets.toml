description = "Runs every step of a workflow in order through the AD-8 state machine, each a bounded agent loop (iteration, tool-call and wall-clock caps); hand-offs are next, loop-back (target, maximum default 2, reasons passed as a trusted input) and human gate, which moves the step to waiting_human with a Review item; adds the one Inbox item entity (all kinds) created only by the engine through the writer, and a Failure item when a maximum is passed. Story 4 resolves the items."
verify = "A FakeLlm-scripted three-step fixture runs next, loops back from step 3 to step 1 with reasons that appear as a trusted input in the journal, fails with a Failure item when looping past the maximum, pauses at a gate with a Review item, and each loop cap ends its step when hit."
covers = ["R3"]
after = [2]
hitl = false
risk = "high"

[[entry]]
id = 19
type = "story"
title = "Backgrounded agentic serve keeps answering"
description = "Owner decision 2026-11-23 (story 2's review finding P9, left partial): the `agentic serve` reader that prints a new pairing code when the owner presses Enter (story 2; arch AD-13) runs only while serve is attached to an interactive terminal in the foreground, that is, stdin is a terminal and serve's process group is that terminal's foreground process group. Story 2 already skips the reader when stdin is not a terminal; this story covers `agentic serve &` started from an interactive shell, where the pending stdin read gets SIGTTIN and job control stops the whole server. A serve started in the background never stops for terminal input and keeps serving; brought to the foreground (`fg`), Enter prints a new pairing code again, invalidating any unused one, as in story 2. The start message and the `agentic serve` help line say when Enter works. A serve moved to the background after starting in the foreground (Ctrl-Z, then `bg`) is covered the same way if the chosen approach allows it within the constraint below; if it does not, the plan records it as a residual for the owner and the help line keeps naming `agentic serve < /dev/null &`. Constraint, verbatim from the owner: \"no new dependencies, and keep the `nix` crate's `process` feature unchanged (not enabled)\"; every crate still forbids unsafe code and the Stack's nix line (`term` only) is unchanged, and no nix item outside the `term` feature is used, even though Cargo feature unification through process-wrap already compiles nix's `process`, `signal`, `fs` and `poll` items into the build (so `tcgetpgrp` and `getpgrp` are off limits). Story 2's pairing-code rules are unchanged: a code is printed only on the serve terminal, never over the API, a CLI command or a file. If no approach meets the constraint, the build stops and comes back to Sofia; it never moves the trigger off Enter or enables a nix feature."
verify = "Written first, failing, in am-app's real-binary serve tests (`crates/am-app/tests/serve_project.rs` or a sibling file; macOS, with a compiling skip on Linux, AD-47): the real `agentic serve` started as a background job of a job-control shell on a pseudo-terminal (the pseudo-terminal is its controlling terminal and its process group is not the foreground one, as `agentic serve &` from an interactive shell) is not stopped and keeps answering CLI-token requests on /api/v1 for at least 5 s, and before the fix the same test sees serve stopped by SIGTTIN; started in the foreground on a pseudo-terminal, Enter still prints a new pairing code that invalidates the previous one; with stdin not a terminal nothing reads stdin (story 2's cases stay green); the workspace Cargo.toml and Cargo.lock gain no crate, the workspace nix line still declares `features = [\"term\"]` only, no crate's Cargo.toml names nix with another feature, and the change uses no nix item outside `term`; `just check` is green."
covers = ["R12", "R7"]
after = [2]
hitl = false
risk = "low"

