covers = ["R4"]
after = [2]
hitl = false
risk = "low"
references = ["ux-agentic-manager/mockups/key-seat-sheet.html"]

[[entry]]
id = 5
type = "story"
title = "Developer hat approves in its subtree"
description = "A human seat can wear the Developer hat; Proposals that change tools, models or prompts of seats in its subtree list it as approver, apply under it with 'You (Developer hat)' in History and audit, and a proposal touching a seat outside the subtree cannot be applied under that hat; the Developer card's live fact links to pending proposals in its subtree."
verify = "Fixture org with a Developer hat over D1 on the Company A fixture: UJ-3's memory-note proposal applies under the hat and History reads 'You (Developer hat) · applied proposal'; a proposal for a seat in another team is refused under the hat with a worded reason; the Developer card shows '1 pending proposal' and opens it."
covers = ["R5"]
after = [4]
hitl = false
risk = "medium"
references = ["ux-agentic-manager/mockups/key-assistant.html §1"]

[[entry]]
id = 6
type = "story"
title = "Ask a seat becomes an Inbox thread"
description = "The one-line field at the Inbox list foot creates a Question thread addressed to the seat the owner picks (any seat; by default the top Coordinator seat, else the top head seat, and for a selected item from a department that department's head seat; ⌥↓ opens the seat picker); the seat answers in a one-step run under its caps (read access to its own tables and grants only; the answer run is epic 9 story 18's); the reply arrives in the thread, may cite rows or runs as resolving chips, and the owner can follow up in the same thread; the ledger attributes it to the seat. Matches key-inbox.html."
verify = "Playwright on FakeLlm: typing 'Why was Report R1 returned twice this week?' and Return creates a thread; the scripted reply arrives citing Run #12 · step 6 (D1-Head's review) and two notes, each chip opening its source; a follow-up in the thread gets a second reply; the ledger shows both runs under the addressed seat; a question to a picked seat (D1-E2) is answered by D1-E2 and charged to it."
covers = ["R6"]
after = [5, "9.18"]
hitl = false
risk = "medium"
references = ["ux-agentic-manager/mockups/key-inbox.html"]

[[entry]]
id = 7
type = "story"
title = "Performance budgets hold"
description = "Adds the rule_18 tests, written to fail first, on a 30-seat fixture department: interaction latency under 100 ms for the measured set (open sheet, select seat, toggle team, grid sort, palette open), 60 fps while expanding and running on the org chart, idle memory under 300 MB without models, and cold start under 3 s; fixes regressions found; budgets run in CI and per release."
verify = "The rule_18 suite passes on the macOS runner and its report lists each budget with the measured value; a deliberately slowed fixture component makes it fail."
covers = ["R7"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Accessibility audit passes"
description = "Adds the rule_19 tests, written to fail first: axe on every surface in light and dark, a keyboard-only Playwright pass through every key flow (every drag has its key; single-key shortcuts off in Settings › General), ARIA tree and live-region checks, reduced motion and 200% zoom; fixes the findings; findings beyond one session become new stories."
verify = "The rule_19 suite passes in CI: zero axe violations on every surface in both themes, the keyboard-only flows UJ-1, UJ-2, UJ-3 and Flows 4–6 complete, and the org chart announces seats as specified."
covers = ["R8"]
after = [7]
hitl = false
risk = "medium"
references = ["ux-agentic-manager/mockups/key-states-keyboard.html"]

