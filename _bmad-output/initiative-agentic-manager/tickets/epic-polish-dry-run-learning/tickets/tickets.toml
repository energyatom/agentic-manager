# Epic 10 — Polish, dry-run, learning loop and design/a11y QA. Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>' (final review coverage F8).
# Engine lane (1–3) shares run mode and am-store views; proposal lane (2, 4, 5) shares the Proposal path; QA lane (7–9) touches every surface and runs last.
# Definition of Done for every UI story (final review UX M3), whether or not its verify repeats it: axe clean in light and dark,
# the story's path completed keyboard-only, and reduced motion honoured.

[[entry]]
id = 1
type = "story"
title = "Dry-run a workflow from the editor"
description = "Tracer bullet: runs gain mode real or dry_run fixed at start; 'Dry-run with local models' in the workflow editor shows its own estimate line and starts a run that substitutes every seat's model with the chosen cheap or local model (cheapest local by default; with no local model, the cheapest model across the company's Accounts by the prices file, named with its estimate), spending against the same caps; the Runs list and Run view label it 'Dry run'. Matches key-workflow-run.html §1."
verify = "Playwright on FakeLlm: the editor's dry-run control shows a range estimate for the substituted models; starting it creates a run with mode dry_run whose journal shows every call on the substituted model; with no local Account the control names the cheapest priced cloud model with its estimate; the Runs list row and Run view header read 'Dry run'; a cap breach stops it like a real run."
covers = ["R1"]
after = ["9.13", "7.5"]
hitl = false
risk = "medium"
references = ["ux-agentic-manager/mockups/key-workflow-run.html §1"]

[[entry]]
id = 2
type = "story"
title = "The Coordinator's learning loop proposes changes from outcome reasons"
description = "The Coordinator role template gains a learning workflow with its schedule paused until the owner sets one; the seat reads gate return and rejection notes and status-change reasons recorded since its last proposal (as UntrustedData) and raises Proposals for memory-note or instruction changes through the built-in local-write propose_change tool, whose manifest epic 4 registers (4.8), citing source rows; the card (epic 8) shows the rows and the tainted flag; nothing applies until the owner applies it; History records the apply; epic 4's injection pack (4.9) gains poisoned-reason cases. A Proposal raised by a learning run that read untrusted reasons is tainted-origin and never approvable (arch AD-10 (b), owner delegated 2026-11-19, final review 2 security H2): the owner can Dismiss it or start an own edit from it."
verify = "On FakeLlm: with 5 'budget frozen' rejection reasons, a scheduled learning run raises one Proposal citing those 5 rows with the tainted flag; it applies only from a real click and History records it; a run with no new reasons raises nothing; the Proposal built from the 5 tainted reasons is tainted-origin and its apply is refused even with a valid confirm token, offering only Dismiss and 'Start my own edit from this'; poisoned reasons asking for a new tool or host yield zero approvable proposals and zero outbound calls."
covers = ["R3"]
after = [1, "8.6"]
hitl = false
risk = "high"
references = ["ux-agentic-manager/mockups/key-assistant.html §1"]

[[entry]]
id = 3
type = "story"
title = "Dry-run data stays apart from real data"
description = "Rows, row history, documents and Inbox items a dry-run creates carry the dry-run flag and the 'Dry run' label everywhere; v_* views, saved views, dashboards and the estimator's history exclude them unless a view or query asks explicitly; external-effect calls in a dry-run raise no approval and are recorded as 'would have asked'. Events from a dry-run (workflow_completed, step_completed, document_updated) and its hand-offs start no real run and are recorded as 'would have started' (arch AD-37, amended 2026-11-19, final review 2 security M4)."
verify = "After a dry-run of the golden workflow: its rows show 'Dry run' in the grid when shown and are absent from v_table-t1, Table T1's default view, a pinned dashboard and the next estimate's basis; its Report R1 version, lineage and Inbox items are labelled; a scripted external-effect call appears in the journal as 'would have asked' with no Approval item. A dry-run of F2 completes and starts no real run of D1's workflow (zero runs with mode real, one 'would have started' journal line)."
covers = ["R2"]
after = [2, "7.5", "8.8"]
hitl = false
risk = "high"

[[entry]]
