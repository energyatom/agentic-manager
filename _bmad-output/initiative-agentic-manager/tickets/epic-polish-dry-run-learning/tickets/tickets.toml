type = "story"
title = "Memory notes from proposals stay editable"
description = "In the seat sheet's Memory notes section, a note added by an applied learning proposal shows its proposal and source rows (each opens in Tables); the owner adds, edits and deletes any note through the config writer with History and Undo; notes keep reaching prompts in the AD-27 order."
