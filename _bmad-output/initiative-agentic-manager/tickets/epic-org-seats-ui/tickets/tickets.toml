# Epic 5 — Org and Seats UI with live cost meter and first-run wizard. Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>' (final review coverage F8).
# One lane to the picker (Accounts follows the seat sheet because both register routes in the shell); then the seat-sheet lane (8, 9, 10)
# and the toolbar lane (6, 7) run beside each other and join at the import dialog and wizard.
# Every UI story names the mockup it matches; acceptance tests (Playwright, vitest, axe) are written from the ticket first.
# Definition of Done for every UI story (final review UX M3), whether or not its verify repeats it: axe clean in light and dark,
# the story's path completed keyboard-only, and reduced motion honoured.
# The first-run wizard is split (final review UX high 3): story 16 (company and Accounts) follows the picker and, because it registers the first-launch route in the shell,
# the toolbar lane (6) and the seat-sheet lane (8) now start after it; story 12 (template, test, org chart) closes the lane.
# 2026-11-21 Sofia REPLAN (owner: no terminal in the product): 16 owns creating a project (pre-open state, ConfigCreate, project_id at create); new 19 follows 16 with the open decisions (Open here anyway, Confirm move, Treat as new project).
# 2026-11-19 owner folder-access direction: 4 shows file chips, 9 adds What leaves this Mac, 16 lists Folder access, 17 draws the Folder access chip (linked folders, file-type badges, text fallback, write switch).

[[entry]]
id = 1
type = "story"
title = "App shell signed in from agentic serve"
description = "Tracer bullet: scaffolds web/ (React, TypeScript, Vite, Radix-style primitives, vitest, Playwright) embedded in the binary and served by `agentic serve` under a strict CSP (connect-src the loopback origin only, no remote fonts, images or scripts); DESIGN.md tokens become CSS variables for light and dark following the OS; ts-rs types generate into web/src/api/generated with a CI drift check; the shell shows the sidebar and the toolbar with company name and breadcrumb, and the Org route lists teams from /api/v1 after the launch-code sign-in; Playwright runs in CI on Chromium, WebKit and Firefox engines plus Edge. Adds a token-contrast unit test that checks every text and icon foreground/background pair DESIGN.md names against WCAG 2.2 AA in light and dark (the amber status dot included, final review UX M3). Decides the TypeScript version (arch Open Questions) as a Decision. Matches key-org.html §1 (sidebar and toolbar). Owner step: run `agentic serve` (or `agentic open` with the login item from epic 4 story 14) on the owner's Mac and open the app."
verify = "`agentic serve` opens the browser signed in and the Org route lists the project's teams in light and dark; the token-contrast test passes and fails when a DESIGN.md pair is lowered below AA; Playwright in CI loads the shell on every engine with no CSP violation and no request off the loopback origin; changing an am-api type without regenerating fails CI; the owner confirms the shell opens on the owner's Mac."
covers = ["R15", "R13"]
after = ["3.2"]
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Org chart in teams and seats"
description = "Renders the org chart from config as a top-down ARIA tree: collapsed team boxes (name, status sentence, weekly cost, avatar strip with seat count and how many are you) and expanded seat cards (avatar, name, role, occupant and model, status, this week's spend) toggled per team with Space and globally with the Teams/Seats control and ⇧⌘E; arrows move selection and Return opens the sheet route; Fit ⌘0 and zoom ⌘+/⌘−; more than 5 reports wrap in rows of 5; expand state persists per team; solid reporting lines; live status and spend from the WebSocket with a 1 Hz pulse (static under reduced motion); picks the renderer (own tidy tree or @xyflow/react) by measuring 60 fps at 30 seats and records it as a Decision. Matches key-org.html §1–2."
verify = "Playwright on the Company A fixture toggles one team and all teams by mouse and by keys, walks the tree with arrows, and the accessibility tree announces each seat with name, role, model, status and spend; a 30-seat fixture renders at 60 fps in a recorded trace and Fit shows it whole at 1440×900; a FakeLlm run pulses the running seat's dot and the dot is static under reduced motion."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"

[[entry]]
