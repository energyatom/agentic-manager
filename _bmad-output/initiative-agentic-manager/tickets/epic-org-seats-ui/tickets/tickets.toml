risk = "high"

[[entry]]
id = 17
type = "story"
title = "Agent card: identity, capabilities, skills, knowledge and links"
description = "Turns the AI seat sheet into the Agent card (owner statement B, 2026-11-18; EXPERIENCE.md Seat sheet (Agent card), Identity, Skills, Drop folder, Reference files, Saved links; DESIGN.md Agent card, agent-card-index, skill-card, avatar-tints): sticky section headers in this order (final review 2 UX high 1 and M6, owner delegated 2026-11-19): Identity, Brain, Capabilities, Skills, Tools & connectors, Knowledge & inbox, Tasks (epic 6 story 12), Memory notes, Budget, What this seat can touch, with a compact five-group jump row (Identity, Brain, Powers, Context, Limits; ⌥1–⌥5) instead of a ten-anchor index; Skills, Knowledge & inbox, Memory notes and Budget start collapsed to a one-line summary when empty or unchanged from the template and expand on click or Return, with the What this seat can touch one-line summary pinned at the foot; Identity edits name, role, goal (≤500), backstory (≤2,000) and the avatar tint (six swatches; the seat card on the Org view uses it) as config edits with Undo; seats made with N from a role template arrive with the role's goal, backstory and capabilities; Capabilities (owner addition 2026-11-18; arch AD-46; EXPERIENCE.md Capabilities; redrawn 2026-11-19, final review 2 UX high 1) sits right below Brain as one compact row of nine on/off chips (filled when on, outlined when off, with a pending-amber outline while a switch awaits review), each chip opening a small popover with its one-line 'Lets D1-E2 …' summary and, for the three with a real choice (Web search, Browse & read pages, Crawl), the Provider menu ('Built-in (default)' or an Account of a matching kind with its price, '+ Add Account…' at its foot); a provider label shows on the chip only when it is not the built-in; the Folder access chip's popover (owner folder-access direction, 2026-11-19; EXPERIENCE.md Folder access) lists the seat's linked folders (path, Read only or Read & write, patterns, file count) with + Link folder…, and under each folder the file types found there (the API counts the folder's files by extension through WorkspacePath, epic 4 story 6; read-only, no content read) as badges marked by what the seat's model reads ('PDF ✓ · PNG ✓ · XLSX ✗ needs a model that reads office files'), a 'Text fallback for text-only models' switch, and 'Leaves this Mac → <host>' when the seat's model is a cloud Account; linking a folder, switching Read & write on and linking to a cloud-model seat open story 9's two-step confirmation; switching one on or choosing an Account opens story 9's two-step confirmation naming what the seat may then touch and the host it adds ('Keep current access' the default), switching off is a plain edit with Undo, and the What this seat can touch panel updates live; Skills lists the attached skills as skill cards (name, description, reference-file count, 'asks for' chips: granted plain, ungranted 'not granted' with 'Add in Tools & connectors…' opening story 9's tools library and confirmation) and attaches with S or Attach skill… from the project's skills, detaches with ⌫, both undoable, without ever changing tools or hosts; Knowledge & inbox shows the drop folder from story 3 under 'Inbox · processed once' with Paste links… (writes the pasted URLs as a links-<timestamp>.txt list into the folder) and the skipped-hosts line the API reports, reference files under 'Reference · kept' (Add file… copies the file through the API into .agentic/knowledge/<seat-id>/ and lists it; Remove takes it off the list and asks, defaulting to keep the copy) and saved links grouped by group (Add link… with title, URL and group; a host outside the allow-list reads 'Host not allowed' with Allow host… through story 9's privilege-widening confirmation). Matches key-seat-sheet.html §1 and §4 (Allow host)."
verify = "Written first, failing: Playwright opens D1-E1's card on the Company A fixture and finds the sections in the order above with the foot summary, and the Capabilities chip row starts within the first 600 px at 1440 × 900 below a visible Brain section; switching Calculate & analyse on opens the confirmation and Return keeps current access with the seat file unchanged, while the named button writes it with one History entry and the touch panel gains its tools; choosing a fixture Tavily Account as Web search provider shows 'D1-E1 may send search queries to api.tavily.com.' first; a new seat from the Analyst template shows its role's switches; a seat with no capabilities block shows only Folder access on; on D1-E2 (local text model, text fallback on) the Folder access popover shows the sample folder Read only with CSV ✓ text · PDF ✓ text layer · PNG ✗ · DOCX ✗ and no Leaves this Mac line, on D1-E1 it shows 'Leaves this Mac → api.anthropic.com', + Link folder… on D1-E1 opens the confirmation naming the folder and the host and Return writes nothing, and switching Read & write on opens the confirmation; ⌥3 scrolls to the Powers group (Capabilities) and focuses its label; a pending chip shows the amber outline and an off switch state, never a half-on one; editing the goal and backstory writes the owner's seat file with one History entry each and ⌘Z restores them; changing the tint repaints the owner's seat card; a seat added with N as Researcher arrives with the role's goal and backstory; attaching the fixture skill whose allowed-tools names read_pdf_url writes skills: [..] only, the card shows 'not granted' on that chip, and the core's computed touch panel and grant set for D1-E1 are byte-identical before and after (and after detaching); Paste links… with three URLs creates one link list in its drop folder and the waiting count rises by one; Add file… puts a copy in .agentic/knowledge/d1-e1/ listed as Kept and Remove with the default leaves the copy on disk; Add link… to unlisted.example shows 'Host not allowed', Return in Allow host… keeps current access and writes nothing, the named widening button adds the host as one History entry; the path completes keyboard-only and axe passes in light and dark."
covers = ["R18", "R19", "R21"]
