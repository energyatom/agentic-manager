[[entry]]
id = 9
type = "story"
title = "Tools, budget and what this seat can touch"
description = "The seat sheet's Tools & connectors section, grouped Built-in, Connectors (MCP tools, filled by epic 9 story 5) and Readers (read website, read URL, read file, arXiv), each chip showing its class on hover and the hosts this seat's allow-list lets it reach, with the caption that Sources run on their own schedule without a model and that watching pages is a Crawler or HTTP Reader Source loading only what changed (owner statement B and owner connector direction, 2026-11-18; the Sources group itself is epic 12 story 14) (Tools library by A, drag, or arrows and Return; remove with ⌫), Budget field (per run, week and month; scheduled and manual caps as two lines; On breach) and an always-visible 'What this seat can touch' panel computed by the core from the same manifests, grants and Account hosts ToolGate uses (Reads, Writes, Sends out per host with what goes there, What leaves this Mac — each linked folder whose files go to a cloud model, with its host, computed by the core from the seat's folders and its model and fallback Accounts (epic 1 story 12), added 2026-11-19 — and Never), updating live with a brief highlight; adding an external-effect or MCP tool, a new egress host or raising a cap opens the two-step privilege-widening confirmation (Keep current access primary and default, the widening action named by its effect) backed by epic 4's confirm token (4.3), which the dialog receives over its own session's WebSocket (arch AD-15); epics 6, 7, 8 and 9 reuse the dialog. Matches key-seat-sheet.html §1. Batch review (final review 2 UX M9, 2026-11-19): when several widenings are pending on one sheet (for example three capability chips switched on), the sheet shows one 'Review 3 changes…' button and one confirmation lists each by its effect sentence and applies all with one confirm token (arch AD-15); a paid provider row shows its price per call ('≈ <price> per search', from models/prices.yaml) in the menu and in the dialog (final review 2 UX M10)."
verify = "Playwright adds Read website to a seat and it appears under Readers with its hosts while Sends out gains the host with a highlight; adding the fixture external-effect tool or raising a cap opens the confirmation, where Return keeps current access and nothing changes, and the named widening button applies it as one History entry; for every Company A seat the panel equals the core's computation, D1-E1's listing the sample folder under What leaves this Mac with api.anthropic.com and D1-E2's (local) listing nothing there; a widening call without the confirm token is refused by the API. Switching three capabilities on shows one 'Review 3 changes…'; its dialog lists three effect sentences, Return keeps current access with no file changed, and the named button writes the three changes as one History entry; the fixture Tavily row shows its per-search price in the menu and in the dialog."
