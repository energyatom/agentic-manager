[[entry]]
id = 16
type = "story"
title = "First-run wizard: company and Accounts, local models made easy"
description = "Pulled forward so the most important experience is built early (final review UX high 3): with no company.yaml in the served folder the app opens the wizard; step 1 takes the company name, with timezone and currency pre-filled from the Mac's system locale for the owner to confirm (no hard-coded locale; final review 2 M6, 2026-11-19), and shows the saved path; step 2 is drawn zero-key first (final review 2 UX high 3, owner delegated 2026-11-19): it shows story 5's Account cards with local servers detected and, under them, the built-in list; keys sit in one collapsed, optional 'Add a key later' row; with no server found it shows 'No model server found on this Mac.' and a guided one-click path: two buttons, Get LM Studio and Get Ollama, each opening the official download page in the system browser (host shown), then Detect again, which re-probes both ports and moves on by itself once a model is loaded; nothing on this step asks for a terminal, the running-but-no-model state with Check again, Add API key with the key-refused state, and '+ OpenAI-compatible URL' with its host shown plainly; Continue is enabled once any Account works, and a local model server alone is enough (Open by default, RULE-20, 2026-11-18): under the Account cards a 'Built in, no key needed' list shows Web search 'Local search (SearXNG) · free, no key' with its status from epic 12 story 18 (or 'Starting…'), Browse & read pages, Crawl and Folder access (renamed 2026-11-19) as ready, cloud keys are labelled optional and nothing is pre-selected; with no local server and no Account the step states the one choice ('Get a free local model app, or add a key.') above the guided path and Continue stays disabled; quitting resumes at the same step; step 1 creates company.yaml through a config create (below); step 3 onward is story 12's, and until it lands Continue after step 2 opens the empty Org view. Matches key-first-run.html steps 1–2 and EXPERIENCE.md State Patterns (Wizard: no local server found; Local server: no model loaded; Adding an OpenAI-compatible URL). (restated 2026-11-21, Sofia REPLAN, owner decision; arch AD-15, AD-16, AD-32) This story owns creating a new project and builds the pre-open state that story 19 reuses: `agentic serve` on a folder with no config file at all no longer refuses (story 1.13) but stays up in the pre-open state (arch AD-32: the signed-in UI, CLI token and run file as usual, no store open for the project, no run, schedule, trigger, Source load, MCP server or child; status and the wizard answer, every other route answers `project_not_open`; the WebSocket serves status events and confirm tokens; a lock keyed by the root's identity, held into the open, makes a second process on the folder refuse naming the holder; the marker is written first and the wizard refuses to create while another Mac's marker is present) and opens the wizard; am-server reaches the create and the open only through an `Arc<dyn ProjectOpener>` port that am-app implements, and the open happens in the same process with the session kept and the sandbox self-test run at that hand-over; a folder holding config files but no company.yaml shows its refusal in words with no action; wizard progress is kept in the store as a row per completed step by Actor::Human; step 1 is the UI-class create: under the runtime base's lock project_id is minted, its runtime folder created, the root recorded and the store opened, then am-config's new ConfigCreate (story 1.8's writer edits only existing files; the create writes atomically, renames without replacing and refuses in words if the file appeared meanwhile, with the same intent, History and audit as a config edit, Actor::Human) writes company.yaml holding the id (placed by hard link then removal of the temp file, so an existing name refuses), and its History, audit and approved-grant-set baseline computed from the created file only (arch AD-16, epic 4 story 18) commit in one transaction in the new store; the whole create runs under the runtime base's lock, the root enters the index only after the create commits, and a failure before that removes the new runtime folder; a ConfigCreate is classified by is_widening against an empty grant set (epic 4 story 17); the CLI never creates a project."
verify = "Written first, failing: with only an LM Studio fixture and an empty keychain, step 2's Continue is enabled and the built-in list shows Local search as ready with no key field touched; with neither, the one-choice sentence shows and Continue is disabled; Playwright on an empty folder with recorded fixtures opens the wizard, completes steps 1 and 2 by keyboard alone and by mouse; with no local server the no-server sentence and both links show their hosts; an LM Studio fixture with no loaded model shows the no-model sentence and Check again picks up a loaded model; adding an OpenAI-compatible URL shows its host before Add and lists its models; a refused key is not stored and shows 'That key was refused by Anthropic. Check it and try again.'; a reload mid-wizard resumes at the same step; axe is clean on both steps in light and dark. (zero-key path, 2026-11-19) with only an Ollama fixture the step shows the server card, Local search · Built in · ready, and the collapsed 'Add a key later' row, and no key field is visible until it is expanded; with no server, Get LM Studio opens lmstudio.ai and Get Ollama opens ollama.com in the system browser (asserted on the opener call), starting the fixture server and pressing Detect again moves to the next step; a fixture locale of de-DE with Europe/Berlin pre-fills EUR and Europe/Berlin and en-US with America/New_York pre-fills USD; no string on the step contains 'terminal', 'command' or 'agentic '. (project creation, 2026-11-21) With HOME a temp folder, `agentic serve` on an empty folder opens the wizard where story 1.13 refused, and before step 1 no runtime folder exists and the API refuses every project route but status and the wizard; after step 1 the folder holds only company.yaml (with a UUIDv7 project_id) and .agentic-open, and the runtime folder under the temp runtime base holds the store with one History entry and one audit entry by the owner for the create and an approved grant set, so the next startup is not held; a company.yaml written into the folder after the wizard opened makes step 1 refuse in words and leaves that file byte-identical; an am-config test shows a ConfigCreate carrying a grant is classified as widening and one with none is not; a folder holding seats/ but no company.yaml shows its refusal with no action; a second `agentic serve` on the same folder refuses naming the first; a fault injected before the create commits leaves no runtime folder and no index entry; a reload after step 1 resumes at step 2 from the store; no CLI command creates company.yaml."
covers = ["R1", "R6", "R22"]
after = [4, "1.13", "2.3", "2.4", "4.18"]
hitl = false
risk = "medium"

[[entry]]
id = 19
type = "story"
title = "Open decisions: Open here anyway, Confirm move, Treat as new project"
description = "Added 2026-11-21 (Sofia REPLAN; owner decision: no terminal in the product; arch AD-15, AD-16, AD-32): story 1.13's terminal-only `--take-over` and `--confirm-move` and its worded fixes get UI equivalents. When an open is refused for a reason the owner can settle, `agentic serve` stays up in story 16's pre-open state and the UI shows one decision page naming the reason in words, with its actions: a marker from another Mac (naming that Mac and when it opened the project) offers Open here anyway; a recorded root on an unmounted volume (naming the recorded and current folders) offers Confirm move, which only re-points that root to its own runtime folder, beside Treat as new project, because a copy cannot be told from a move then; a project whose `project_id` was changed or removed while its root is indexed (naming both ids) offers Keep this project's state, which writes the indexed id back, or Treat as new project; a copy of another project (naming both folders) offers Treat as new project, which mints a new project_id with its runtime folder (AD-32's order) and writes only that line of the copy's company.yaml, because copying a company to start another one is normal. Each action opens a confirmation whose default (Return or Esc) keeps the project closed and is a Human command through the ProjectOpener port: under the runtime base's lock it re-reads the reason and company.yaml's sha256 and refuses if either changed, opens and migrates the store, records its audit entry (reason, and the other Mac, old root or old id) and only then applies its effects on disk (marker, root index and record, company.yaml); a failure before the audit is recorded changes nothing. Open here anyway and Confirm move are runtime decisions the CLI may also make only as story 1.13's startup flags; Keep this project's state and Treat as new project write config, so they are UI class only and no CLI-token route makes any of them (AD-15). A project_id write never writes an approved grant set (AD-16), so after Treat as new project the copy's first load is held for the two-step confirmation of every widening grant (epic 4 story 18). A refusal the owner cannot settle there (an identity tool failing, an unreadable or newer company.yaml, an unverified legacy copy, a legacy folder beside runtime state, a database newer than the app) shows its words with no action. After an open, when the project lies in a git work tree and its root .gitignore does not list `.agentic-open`, the open report offers Add to .gitignore (owner decision 2026-11-21): a Human UI-class command through am-config appending that one line, creating the file if absent, audited; the app never writes .gitignore on its own. No string on these pages names a terminal command. Matches the EXPERIENCE.md State Patterns entries for these states and a key-states-keyboard.html section, which Sally adds (UX follow-up owed, 2026-11-21); the story does not start until they exist."
verify = "Written first, failing (Playwright and am-server tests, HOME a temp folder): a fixture project whose marker names another Mac shows the page naming that Mac; Return or Esc in the confirmation keeps it closed with the marker, runtime folder and project files unchanged; Open here anyway opens it, replaces the marker and writes one audit entry by the owner naming the other Mac; a fixture whose root record names an unmounted volume shows Confirm move and Treat as new project, and Confirm move opens it and re-points the root; a fixture whose project_id was edited shows both ids with Keep this project's state, which writes the indexed id back as one line (comments kept) and opens the old state, and Treat as new project; a copied fixture beside its original names both folders and Treat as new project gives the copy a new UUIDv7 project_id (one History entry by the owner in the copy's new runtime folder, no approved grant set) while the original's company.yaml and runtime folder stay byte-identical, and the opened copy's first load is held for the widening confirmation with zero runs started; a decision whose company.yaml changed after the page loaded is refused; a fault injected before the audit is recorded leaves marker, index and files unchanged; the same commands with the CLI token are refused; a stub identity tool failure shows its words and no action button; in the pre-open state no run, schedule, Source load or MCP server starts; in a fixture git work tree without the ignore line the open report offers Add to .gitignore and one click appends `.agentic-open` with one audit entry, while declining writes nothing; no string on the pages contains 'terminal', 'command' or 'agentic '; the path completes keyboard-only and axe is clean in light and dark."
covers = ["R24"]
after = [16, "1.13", "4.18"]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Live cost meter and Stop everything"
description = "The toolbar meter shows settled plus reserved weekly spend against budget with a ring, ticks at most once a second during runs, turns amber at 80%, shows 'Stopped at budget' at 100% (then linking to the Budget ask), never projects and announces only threshold changes; clicking it at rest opens Models & Costs › This week (spend by seat, team, week and run in the company currency formatted by the system locale, and USD, caps used, local calls as ₹0 with tokens and time). Stop everything (button and ⌘.) opens a popover naming what will stop from epic 4's API, Return confirms and Esc cancels; afterwards a banner on every surface offers 'Resume schedules…', each resumed on its own, and the meter freezes. Matches key-org.html §3–4 and key-models-doctor-history.html §1 (Costs)."
verify = "Playwright with a FakeLlm run sees the meter tick no faster than 1 Hz, turn amber at 80% and read 'Stopped at budget' when epic 4's cap stops the run; the costs view equals `agentic status`; ₹120000 shows as ₹1,20,000 and switches to USD; ⌘. then Return cancels the running step, shows the banner on Org and Models & Costs and freezes the meter; Resume on one schedule resumes only it; Esc on the popover stops nothing; only the 80% and stopped changes are announced; with the network fixture offline the toolbar shows the 'Offline' pill beside the meter and cloud seats read 'Waiting for network' while local seats keep running (EXPERIENCE.md State Patterns, No internet)."
covers = ["R11", "R14"]
after = [5, 16, "4.2", "4.4"]
hitl = false
risk = "high"

[[entry]]
id = 7
type = "story"
title = "Estimate line and the Workflows list"
description = "An estimator in am-engine, a read-only consumer of ledger history that excludes dry-run runs, returns a range with its basis ('rough, no history' from prompt tokens × expected iterations × price until 3 runs exist, then p50–p90 'based on your last N runs'), never writes a cap, is stored on each run at start and recalculates within 300 ms of a seat or model change; the Estimate line component adds 'May stop at the ₹150 run cap.' when its top exceeds the remaining cap; the Workflows list (schedule in words, next run, last result as 'Estimate ₹80–120 · Actual ₹96' with a verdict, Run now with its estimate and ⌘R through epic 4's run-start command) carries it; epic 6 reuses both components. Matches key-workflow-run.html §1 (estimate under Run now) and §3 (estimate against actual)."
verify = "On FakeLlm the first estimate reads 'rough, no history' and after 3 runs 'based on your last 3 runs', always a range; changing a seat's model updates the line within 300 ms; a range above the remaining cap shows the cap warning and the cap file is unchanged; after a run the Workflows list shows estimate, actual and verdict; on scripted FakeLlm runs from run 3 the actual falls within ±30% of the estimate (prd SM-6)."
covers = ["R12"]
after = [4, 6, "4.1"]
hitl = false
risk = "medium"

