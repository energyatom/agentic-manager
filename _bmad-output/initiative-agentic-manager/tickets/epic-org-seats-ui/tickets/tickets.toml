[[entry]]
id = 5
type = "story"
title = "Accounts in Models & Costs"
description = "Models & Costs › Accounts: LM Studio and Ollama cards appear on their own badged On this Mac; cloud Accounts are added once with the key sent over the authenticated loopback API straight to the keychain through epic 2's commands and only ever shown masked (never returned, logged or kept in browser storage); each card shows health, models, egress host and the seats using it; a local server that is running with no model loaded reads 'LM Studio is running, but no model is loaded. Load one in LM Studio, then Check again.' (Ollama: 'Ollama is running, but no model is pulled. Run ollama pull <model>, then Check again.') with Check again; '+ OpenAI-compatible URL' (vLLM, llama.cpp, OpenRouter) takes a base URL and optional key, shows the host plainly before Add ('Calls will go to openrouter.ai' or 'On this Mac · 127.0.0.1:8080'), lists the models it reports and adds the host through story 9's privilege-widening confirmation once that exists (until then through epic 4's confirm token); a revoked key turns the card red with 'Anthropic refused this key. Seats using it are on their fallback. Replace key…'; removing one names the seats that will fall back; the company default model and the price file's updated date show. Matches key-models-doctor-history.html §1 (Accounts), key-first-run.html step 2 card states and EXPERIENCE.md State Patterns (Local server: no model loaded; Adding an OpenAI-compatible URL; Account key revoked)."
verify = "Playwright adds an Anthropic Account with a canary key on FakeSecretStore: the card shows it masked, and the leak scan finds the canary in no response body, log, journal or browser storage; LM Studio's card shows On this Mac from a recorded fixture; a refused key shows 'That key was refused…' and is not stored; removing an Account lists the seats that will fall back before confirming; an LM Studio fixture reporting no loaded model shows the no-model sentence and Check again picks up a loaded model; an OpenAI-compatible URL on a recorded fixture shows its host before Add and lists its models, a URL on the app's own port or a LAN address is refused in words; a fixture 401 on a stored key shows the revoked state with the exact sentence."
covers = ["R6"]
after = [3, "2.4", "2.5"]
hitl = false
risk = "high"

