description = "N on a selected seat (or + Add seat on a team box) opens the add-seat popover (final review 2 UX high 2, owner delegated 2026-11-19; EXPERIENCE.md Add a seat in under 60 seconds; key-seat-sheet.html §5): Name, Role template (the eight, with each one's capabilities named in one line), Model pre-filled with the company default (or the role's Recommended model when connected) and Create; Create writes the seat with the role's instructions, goal, backstory, capabilities, default tools and budget as one config edit (a shipped role template's capabilities need no confirmation, arch AD-15) and selects the new card, the Agent card staying closed unless the owner opens it with Return (the card is for editing, not creating); seats re-parent by drag, ⌥↑/⌥↓ and 'Move to…'; Duplicate and Remove sit in the context menu, and removing a seat used in a workflow asks first; teams are added and removed (only when empty); each change is one config edit with Undo, and a new card slides from its parent. Matches key-org.html §2 and the Role template menu in EXPERIENCE.md (spine-only)."
