# Agentic Manager — epics in build order (decisions.md "Epic order"; arch Capability → Architecture Map).
# Table order is build order. `id` is permanent, never reused. Epic 12 (split from epic 9 on 2026-11-18) builds between epics 8 and 9.
# `constraints` (ignored by tickets.py) names the initiative Constraints each epic owns.
# `covers` here cites initiative ids (R1-R84; R83-R84 added 2026-11-19 for folder access; R78-R82 added 2026-11-18 for Open by default and the built-in capabilities; R73-R77 added 2026-11-18 for the owner REPLAN (cross-department work); R58-R63 added 2026-11-18 for the owner's seat anatomy; R64-R71 added 2026-11-18 for the owner's connector direction; R72 added 2026-11-18 for rendering); each epic's own tickets.toml `covers` cites that epic's local ids, which name their 'parent R<m>'.
# Global constraints, owned by no single epic and binding every epic they touch:
#   Narrow scope (RULE-1); Generic engine (RULE-2: denylist scan from epic 1, fixture-through-grant proof in epic 7);
#   Propose, then approve (RULE-3); Local and private (RULE-5); Failing-first tests (each RULE-8..19 test lands in its owning epic);
#   Accessibility (RULE-19: every UI epic; audit in epic 10); AI never-do; Look and feel; Mockups gate UI; Platforms (macOS Apple Silicon only in v1, portable core: Linux portability job in epic 1, owner 2026-11-19);
#   Release shape; Build discipline; Personal data; Cross-department work (owner REPLAN 2026-11-18: engine in epics 3 and 4, UI in epics 5 and 6);
#   Open by default (RULE-20, 2026-11-18: zero-key golden run in epic 12, wizard in epic 5, clean-machine check in epic 11).

[[epic]]
id = 1
slug = "epic-foundations-rust-spike"
title = "Foundations and Rust spike"
description = "The nine-criterion Rust spike has a recorded verdict, and the workspace builds one `agentic` binary whose store, config loader and History validate the Blank department, the role templates and the Company A sample in CI."
covers = ["R1", "R2", "R3", "R5", "R26", "R81"]
constraints = ["Stack", "Licence", "Files are truth", "Audit (RULE-16)", "Developer quality"]
risk = "high"

