[[entry]]
id = 12
type = "story"
title = "Accounts belong to this Mac"
description = "Owner decision 2026-11-22 (arch AD-17, AD-35, AD-15, AD-6); split the same day into this core, story 13 (`accounts migrate`) and story 14 (`accounts change`), built back to back in that order. Accounts are user-level, one per provider key, reusable across projects. They live in one file per macOS user, `~/Library/Application Support/agentic-manager/accounts.yaml`, owned by am-config, with its History and confirmation records in a user store `user.db` beside it, written only under `user.lock`. Projects keep no `models/accounts.yaml`: seats, capability providers and Sources keep `account: <id>`, an id the owner chooses and that is unique on this Mac. An id missing on this Mac is a validate warning and a run needing it is refused, and exports carry references only. `agentic accounts add|remove|list|test` move to the user list with story 1's and story 3's rules unchanged (terminal, typed name, the History entry and confirmation record). Each entry's `secret_ref` equals its id (Keychain service `agentic-manager`, account `<id>`, as today); keys stay only in the Keychain and never reach the user file, `user.db`, History or audit. The confirmed check reads the user record: the latest confirmation record for the id (`account_added`; story 14 adds `account_changed`) with no `account_removed` after it names the same provider, scheme, host and port, and the user file is unchanged since the app wrote it; `remove` records `account_removed`, and refuses while any project in the root records could not be reached, naming each, until `--force`, which lifts only that refusal, never a found reference, and names the skipped projects (owner, 2026-11-22). A project that still holds `models/accounts.yaml` gets a validate error naming `agentic accounts migrate` (story 13) as the fix, and the file is never read to send a key. The Company A sample and the fixtures drop the file, except one legacy fixture kept for story 13's tests. The per-project record of where each Account a project uses sends calls, holding the project until a change is confirmed, is epic 4 story 18's (owner, 2026-11-22)."
verify = "Written first, failing: an Account added in one project is listed, tested and usable from a second project with no second add or key; the user file and `user.db` hold it and no project file does, and the canary key appears in neither; an entry whose `secret_ref` is not its id is refused; a hand edit of the user file refuses every key use, before any Keychain read, until it is put back; `remove` records `account_removed` and a later key use of that id is refused; `remove` is refused naming an unreachable project in the root records, and `--force` removes and names it but never overrides a found reference; a project with `models/accounts.yaml` fails `agentic validate` at that file with the migrate fix and no command reads a key through it; a seat naming an id missing on this Mac validates with a warning and a run needing it is refused; two processes adding Accounts at once both succeed, one after the other, under `user.lock`; `agentic validate` passes on templates and fixtures with no `models/accounts.yaml` (the legacy fixture fails as above)."
covers = ["R1"]
after = [3]
hitl = false
risk = "high"

[[entry]]
id = 13
type = "story"
title = "Move a project's Accounts to this Mac"
description = "Split from story 12 (owner, 2026-11-22: \"make accounts migrate non-destructive\"; and \"(a) migrate should not ask for stored keys — carry over an existing confirmation for the same address if the project had one; otherwise migrate the Account as unconfirmed so it can't send until confirmed normally.\"; arch AD-17, AD-15 *Migrate* and *Record*). `agentic accounts migrate --project <path>` moves each entry of a project's old `models/accounts.yaml` to the user list on a real interactive terminal, each new Account's name typed with History, and never asks for, reads or compares a key: it makes no Keychain call at all, and the key stays in the Keychain under the same id. Per new entry: when the project's store (read-only, audit chain verifying) holds a latest `account_added` for the id, with no `account_removed` after it, naming the file entry's provider, scheme, host and port, and the user store holds no record for that id and is not marked `recovered`, the confirmation is carried over into the user store as `account_added` with `confirmation: migrated`, the project id and the source entry's sequence number and hash, never the key, so the Account can send at once. Otherwise the Account is added unconfirmed: an `account_listed` audit entry, which is not a confirmation record, and no confirmation record, so the Key-use check refuses every key use before any Keychain read until it is confirmed normally, which in the CLI is story 14's `agentic accounts change <id>` first confirmation (a new key typed at the hidden prompt) and from epic 5 story 5 the UI Account card; the sentence names that command. Non-destructive: before the file is removed it writes a backup to `<app data dir>/backups/accounts-migrate/<project-id>/<UTC timestamp>.yaml` (never pruned), fsyncs it and checks the copy's and the file's hashes against the parsed bytes; the file is then removed through the config writer with History, after the user store's records commit. `--dry-run` lists each entry (id, provider, host; new with its confirmation carried over, new and unconfirmed, already present or a clash) and writes nothing. (2026-11-22, arch AD-17 *Recovery*) am-app writes the user store's `recovered` mark when it creates a store while the user Accounts file or `backups/accounts-migrate/` already exists, and a store so marked carries nothing over. Running it twice is safe: an entry already on the user list with the same provider and endpoint is skipped, a different one is a clash. On an id clash nothing is written until `--as old=new`, which adds the Account under the new id unconfirmed (no key is asked for; the old id's Keychain entry belongs to the existing Account) and rewrites the project's references through the config writer with History. `--rollback` restores the file byte for byte from its backup, with any references `--as` rewrote, and leaves user Accounts, the user store's records and Keychain entries alone. It is refused while the user Accounts file or the project has an outside change. Whether `--as old=new`, which renames the project's references to the new id, still counts as the not-widening migration that \"keeps the same ids\" (arch AD-15) is decided in this story's plan and recorded in arch AD-15 *Migrate* by an architect REPLAN before the build, for epic 4 story 17's `is_widening` to encode, never by a second path (owner, 2026-11-22, verbatim: \"a clear rule for --as old=new under 'same ids' (2.13 is the natural home; decide it in the 2.13 plan)\")."
verify = "Written first, failing, on the legacy fixture with FakeSecretStore and a canary key: no key prompt appears at any point and FakeSecretStore records no call; `--dry-run` lists each entry with its outcome and changes nothing (project files, user file and `user.db` byte-identical); `migrate` writes a backup whose hash equals the original's before removing the file; an entry whose project-store `account_added` matches its provider and endpoint gets a user-store `account_added` with `confirmation: migrated` naming the project and source entry, and `accounts test` then sends to that endpoint; an entry with no matching project record (none, another host, another provider, or a record naming no provider), or whose id the user store already has a record for, is added unconfirmed with `account_listed` and no confirmation record, and `accounts test` and a run refuse it before any Keychain read; the canary appears in no file, store row, History or audit; a second run reports nothing to move and writes nothing; a user store created while the user Accounts file already exists is marked `recovered` and a matching project record is then not carried over (the Account is added unconfirmed); an id clash is refused with nothing written until `--as old=new`, which adds the new id unconfirmed and rewrites the project's references, classified as the plan decides (a failing-first test asserts that classification); `--rollback` restores the file byte for byte and leaves the user list, `user.db` records and Keychain unchanged; a non-terminal stdin is refused with nothing written (`--dry-run` only reads and runs anywhere)."
covers = ["R1"]
after = [12]
hitl = false
risk = "high"

[[entry]]
id = 14
type = "story"
title = "Re-confirm a changed Account"
description = "Split from story 12 (owner, 2026-11-22; arch AD-15 *Change*, *Record*, *Key use*). `agentic accounts change <id>` changes an Account's provider or `base_url`, a widening kind, on a real interactive terminal only (refused in words with nothing written otherwise). Owner, verbatim: \"confirm by typing the Account name and seeing old vs new provider/address with an explicit yes — don't require typing the full stored key; if a key check is kept, use a hidden prompt and never echo, log or store it.\" and \"(b) in story 14, a provider change must require a new key (treated as remove + add) and must never send the old key to the new provider; an address change within the same provider is allowed after confirmation with the warning.\" Every change shows the old and new provider and address side by side and the references: each reachable project that uses the Account, with the seats, fallbacks, capabilities and Sources that name it, and each project of the root index that could not be checked, named as not checked (restated 2026-11-22, owner, verbatim: \"accounts change while a project can't be reached: don't refuse. Unlike remove, change keeps the id, so no reference breaks. Instead, the confirmation sentence must list the known projects that use the Account (and say if some couldn't be checked), so I see what the change affects before typing the name.\"; arch AD-15 *Change*, *References*); a project that cannot be reached never refuses a change, unlike `remove`, and `change` has no `--force`. It then requires the Account's name typed and an explicit `yes`; anything else writes nothing and the old record still governs. An address change within the same provider says the key stored under the id will now go to the new endpoint, never asks for, reads, replaces or deletes the Keychain entry, and writes the user file with History and `account_changed` (id, old and new provider, scheme, host and port, references, unchanged key state, `confirmation: typed_id_yes`, never the key). A provider change, and the first confirmation of an Account with no live confirmation record (`change <id>`, flags optional; how an Account `migrate` left unconfirmed, or one whose record a remove or an unfinished change ended, is confirmed normally), is a remove plus an add of the same id: after the name and `yes`, a new key is read at the hidden prompt; under `user.lock` it (1) commits `account_removed` (`reason: provider_change`, `key_for` the new destination), (2) replaces the Keychain entry (service `agentic-manager`, account `<id>`) by delete then set, never reading the old key, and (3) writes the user file with History and `account_added` (new values, references, `replaces`, `confirmation: typed_id_yes_new_key`, never the key). The old key is never read for or sent to the new provider and is not kept; a crash after (1) leaves the Account refused until `change` is run again; Undo of a provider change is refused. A keyless Account's change to a remote endpoint is refused. Until epic 4 story 18 builds the per-project destination record, every kind of change from a loopback to a remote endpoint, or to another host, is refused while a reachable project names the Account (arch AD-15; an unreachable project is only listed as not checked). Until a change is confirmed, every key use (runs, `accounts test`, Doctor) refuses a changed definition with no matching record, before any Keychain read. The per-project record of where each Account sends calls is epic 4 story 18's (owner, 2026-11-22)."
verify = "Written first, failing, with FakeSecretStore recording every call and a canary key: on a terminal, `accounts change` shows old and new provider and address; a wrong name, or any answer but `yes`, writes nothing and the old record still governs; a confirmed address change within one provider asks for no key, makes no Keychain call, writes History and `account_changed`, and `accounts test` then reaches only the new endpoint with the same key; a confirmed provider change prompts for a new key at the hidden prompt, records `account_removed` then `account_added`, makes a delete then a set on the id's entry and never a get of the old key, and `accounts test` sends the new key to the new provider and the old key reaches it at no point; a crash injected after `account_removed` leaves every key use refused until `change` is re-run; an Account migrated unconfirmed is confirmed by `change <id>` with a new key and then sends; a change from a loopback to a remote endpoint, or to another host, while a reachable project names the Account is refused with nothing written; (2026-11-22) with one fixture project in the root index reachable and naming the Account and another unreachable, the sentence, before the name is asked, lists the reachable project with each seat that names the Account and names the unreachable one as not checked, and a confirmed address change on the same host then succeeds with no refusal (no `--force` flag exists); a hand edit of provider or `base_url` with no record is refused before any Keychain read; a non-terminal stdin is refused with nothing written; no key, key prefix or key hash appears in output, logs, History or audit."
covers = ["R1"]
after = [13]
hitl = false
risk = "high"

