type = "story"
title = "Keys never leave the keychain"
description = "Hardens SecretStore over keyring's macOS Keychain store (the only v1 store, arch AD-17, AD-47; its port contract tests also run against FakeSecretStore in the Linux portability job), makes SecretString unprintable and unserialisable and materialised only in am-net request building, adds the always-on redaction layer for tracing and audit (registered secrets and known key patterns), and runs the canary leak scan over logs, journal, audit and config in CI; epic 4 extends the scan to exports. Owner step (moved here from story 1 so a real key first meets the redaction layer and the leak scan, final review F7a): add the owner's real Anthropic key with `agentic accounts add`, run `agentic accounts test` once, then run the leak scan over the owner's own logs and journal."
