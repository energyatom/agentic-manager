[[entry]]
id = 1
type = "story"
title = "Add an Anthropic Account from the CLI and call it"
description = "Tracer bullet: `agentic accounts add|list|test|remove` writes the Account to models/accounts.yaml through the config writer, stores the key only in the keychain through SecretStore (read from the terminal without echo), shows it masked; (restated 2026-11-22, owner decision \"interim CLI exception\"; arch AD-15) `add` and `remove` run only on a real interactive terminal and refuse in words, reading and writing nothing, when stdin is not a TTY, so no agent, script or child process can add an Account and widen its own access; `add` names the Account, its provider and the host its calls go to and requires typing the Account's name to confirm; each write records its History entry and a widening audit entry (`account_added`, Account id and pinned host, no key); from epic 4 story 17 the writer classifies the same edit with `is_widening`, and the path is retired when epic 5 story 5's confirm-token Account card ships (arch AD-15); the first add in a project without models/accounts.yaml creates it as a `ConfigCreate` (arch AD-16: created without replacing, with intent, History and audit; built here and reused by epic 5 story 16); (owner, 2026-11-22) the key is read with echo off through `nix` termios (Stack) and echo is restored on every exit path, including Ctrl-C, an error and a wrong confirmation name; (owner, 2026-11-22) the only terminal in the release binary is the real one: any fake terminal used by tests exists only in test builds (`cfg(test)` or the test-only crate am-testkit, a dev-dependency), and no env var, flag or feature of the release binary can enable it; and `test` streams one short reply from the spike's Anthropic adapter through a first EgressClient that admits only the Account's pinned host. Delivers R1's Anthropic part; story 3 adds OpenAI and compatible Accounts. No real key is used here: the owner's real-key step waits for story 5's redaction layer and leak scan (final review F7a, 2026-11-18)."
verify = "On recorded fixtures with FakeSecretStore and a canary key, `agentic accounts add` on a terminal prompts without echo and asks for the Account's name to confirm (a wrong name writes nothing), `agentic accounts add` and `remove` with a non-terminal stdin are refused with nothing read, written or stored, an added Account has its History entry and an `account_added` audit entry naming the Account and host with no key, a guard test fails if am-testkit (or any fake terminal) reaches a non-dev dependency of the `agentic` binary, a test interrupts the key prompt (Ctrl-C) and finds echo restored, as after an error and a wrong name, the first add in a project without models/accounts.yaml creates it (a file that appears meanwhile refuses the create), `agentic accounts list` shows the key masked, models/accounts.yaml holds only a keychain reference, and `agentic accounts test` streams a reply."
covers = ["R1"]
after = ["1.8"]
hitl = false
risk = "medium"

