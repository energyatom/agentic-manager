# Epic 2 — Accounts and model routing. Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>' (final review coverage F8).
# 2026-11-22 owner: story 12 split into 12 (core), 13 (migrate) and 14 (change), built back to back.
# 2026-11-22 owner answers 2: entries 14 (unreachable projects listed, never refusing), 13 (--as rule decided in its plan) and 6 (Key-use check off the async worker) restated in place.
