# Epic 6 — Runs, Inbox and Documents UI (v0.2). Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>' (final review coverage F8).
# Lanes after the run view: the run and Inbox lane (2, 3, then 6-9, because a Failure's fix button uses story 3's Re-run step)
# and the editor lane (4, 5) beside it.
# Cross-epic prerequisites pin the epic 3, 4 and 5 stories each entry needs (initiative breakdown, Decision 2026-11-18).
# 2026-11-24 owner decision (re-slice of epic 3 story 6, twice): 9 now waits on 3.21 (document versions and Draft items) and 3.22 (rows reaching later steps), and reaches 3.6 through them.
# Definition of Done for every UI story (final review UX M3), whether or not its verify repeats it: axe clean in light and dark,
# the story's path completed keyboard-only, and reduced motion honoured.

[[entry]]
id = 1
type = "story"
title = "Live run view"
description = "Tracer bullet: the Runs list (newest first by day; workflow, trigger scheduled, manual or catch-up, status dot, duration, estimate against actual; filters by team, workflow and status) opens the Run view, whose header shows trigger, start, elapsed and 'Estimate ₹80–120 · ₹45 so far' and whose step list shows each step's live status (done, running pulsing, waiting on you, queued, failed), time, tokens and cost from the WebSocket, replaying missed events with since= after a reconnect; the running step is auto-selected; a seat card's status opens the run at that step; step changes are announced politely. Matches key-workflow-run.html §2 (left column) and §3."
verify = "Playwright starts a FakeLlm run of Company A's flow F1 and watches the steps light up in order with tokens and cost equal to `agentic status`; dropping and restoring the WebSocket replays missed events with no gap; clicking a running seat's status on the Org view opens the run at that step; the finished header shows estimate, actual and verdict; the empty Runs list reads 'No runs yet.' with its button."
covers = ["R3"]
after = ["5.7", "5.13", "3.2"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Drill-down shows every call"
description = "The Run view's right column has Log, Calls and Output tabs: each model call shows its prompt parts in assembly order with their labels (role instructions, CEO goal, guidance, memory, step instruction, trusted inputs, the untrusted fence), each tool call with secrets redacted, each result from web, file, MCP or free-text in table rows inside an untrusted well (plain text with no links, images or HTML, Show all, and the consequence line when an external-effect tool was held), the response, schema validation ✓ or 'Output repaired once', retries, fallback switches and 'Resumed after restart · lost 1 in-flight call'. Matches key-workflow-run.html §2 (drill-down)."
verify = "Playwright opens a FakeLlm step whose script includes a goal, a guidance note, a repaired output, a fallback and an injection-pack PDF: the parts show in order with labels, the PDF text sits in the untrusted well labelled with its source and its embedded HTML and link render as plain text with no network request, the repair chip and fallback line show, and a canary key in a tool argument appears redacted."
covers = ["R4"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Run controls"
description = "Run now (⌘R, estimate first, Return starts), Pause and Resume (a pause flag checked at step boundaries holds the run before its next step; no new run state), Cancel run, Re-run step (continues a run failed at that step) and Re-run from step… (used by story 6's Failure fix button; a new manual run linked to its source, reusing the earlier steps' outputs) arrive as Human commands in the engine, API and Run view, each audited with the Human actor; nothing is deleted; Esc never cancels a run. Matches key-workflow-run.html §2 (controls) and key-states-keyboard.html §1 (Step failed)."
verify = "On FakeLlm through Playwright: Pause lets the running step finish and holds the run before its next step, and Resume continues it; Cancel run ends it cancelled with its journal kept; a run failed at step 1 continues with Re-run step; Re-run from step 3 starts a new run whose steps 1–2 reuse the source outputs and whose journal links the source run; each action has an audit entry 'You'; the ledger shows no call settled twice."
covers = ["R5"]
after = [2, "3.9", "3.11"]
hitl = false
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Workflow editor as a step list"
description = "Workflows › editor: a vertical step list (number, title, seat avatar and name, output, tools) with hand-off labels in words between steps ('then', '↺ loop back…', '◆ waits for you…'); selecting a step opens its editor (seat, instruction, inputs as named references, expected output or schema, hand-off segmented control with loop-back target, maximum default 2 and reason required, or the human seat); steps reorder by drag or ⌥↑/⌥↓ and + Add step appends; every edit writes the workflow file as a config edit with Undo and shows file:line errors inline; epic 5's estimate line under Run now recalculates within 300 ms. Matches key-workflow-run.html §1."
verify = "Playwright changes step 4's loop-back maximum to 3, reorders two steps by keyboard and adds a step: the workflow file holds each change with a History entry, `agentic validate` passes, ⌘Z undoes the last one, an unknown seat id shows its file:line fix inline, and the estimate line updates within 300 ms."
covers = ["R1"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Schedule picker and workflow caps"
description = "The editor's schedule line reads the trigger back in the core's words ('Every Tuesday at 08:00 · if the Mac was asleep, run once on wake') and Edit opens the picker (daily, weekly on a day, monthly; time; timezone defaulting to the company timezone (from the Mac's system locale); raw cron behind More; catch-up once, skip or all) writing the trigger as a config edit; the caps panel edits scheduled and manual per-run caps, the per-week cap and On breach under 'An estimate never raises a cap.', raising a cap through epic 5's privilege-widening confirmation. Matches key-workflow-run.html §1 (schedule and caps) and key-schedule-updates.html §1 (schedule picker). Event triggers (epic 4 story 15) are edited here too: 'When <event>' read back in the core's words, the chain depth limit shown, and a trigger whose target workflow is in another department opening the two-step privilege-widening confirmation (added 2026-11-18, owner REPLAN)."
verify = "Playwright sets weekly Tuesday 08:00 in a fixture timezone (Europe/Berlin) with catch-up skip and the line reads it back in the core's words; raw cron '0 8 * * 2' gives the same sentence; raising the scheduled cap opens the confirmation and Return keeps the old value; the workflow file and History show each applied change.; an event trigger 'When f2-d1 completes' on F1 reads back in words, and adding it from D1's workflow to D2's opens the confirmation"
covers = ["R2"]
after = [4, "5.9", "4.5", "4.15"]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Inbox and While you were away"
description = "Inbox (⌘2): items of every kind sorted by kind urgency then age and paginated by week, each with a kind glyph, title and source line; the detail opens on the right and its primary button names the outcome (Return activates it only when the detail has focus); Question items take an answer (Split input or Use fallback included), Failure items show what happened, what was tried and spent and a fix button (Re-run step, story 3's command), Budget asks offer 'Raise to ₹X once…' through the two-step confirmation or 'Leave stopped', Draft items open their document; the digest card opens after more than 30 minutes away or a restart (runs fired including catch-up on wake, items waiting, spend since last seen, failures and fixes) and dismisses to one line; the sidebar count and tab title track open items; empty reads 'Nothing needs you.' Matches key-inbox.html §1 and key-states-keyboard.html §1 (empty Inbox, budget stop, context overflow)."
verify = "Playwright with FakeClock past a catch-up and a FakeLlm run raising a Question, a Failure and a Budget ask sees the digest name the catch-up run and the spend; answering Use fallback resumes the step; Leave stopped keeps it waiting; Raise once needs the second confirmation; the tab title shows the count; with none left the empty state shows; the list loads the previous week only on request."
covers = ["R6"]
after = [3, "5.9", "4.3"]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Review gate in the Inbox"
description = "The Review item shows the producing seat's output as a table or document with per-item include and return toggles; Approve (Return), Edit (E, inline then approve), Return with note (R, note required, looped back to the producing seat and counted against max_returns) and Reject (confirmed) go through the same Human command as `agentic gate`; the primary counts the outcome ('Approve 5, return 1') with the cost to continue; History and audit read 'You (Reviewer)'. Matches key-inbox.html §1 (Review detail). A Review whose payload is tainted or crossed a department is resolved only here, in the UI (the CLI prints `agentic open --item <id>`; arch AD-15, amended 2026-11-19, final review 2 security H5); a return note the owner writes is trusted input, while one written by a tainted AI reviewer arrives fenced (arch AD-10)."
verify = "Playwright at the golden run's gate toggles one row to return with a note, sees 'Approve 5, return 1' with the cost to continue, presses Return, and the run continues with the note as a trusted input in the producing step's prompt; returning past max_returns gives a Failure item; Reject asks first; the audit entry reads 'You (Reviewer)'. `agentic gate` on the golden run's cross-department Review prints the open-item hint and resolves nothing once this story lands."
covers = ["R7"]
after = [6, "3.4"]
hitl = false
risk = "high"

[[entry]]
id = 8
type = "story"
title = "Approvals and proposals in the Inbox"
description = "Approval items show tool, host, exact arguments, size and first record in a payload well (View all opens the full payload read-only), the untrusted consequence line when the step read untrusted content, and Approve once (Return) or Deny, with no always-allow; Proposal items show the diff, effect line and source references (tainted ones flagged) with Apply, Edit (opens the affected sheet prefilled) or Dismiss, and privilege-widening ones are flagged 'High risk · widens access' and applied only through the two-step confirmation; Apply needs a real pointer or key event and the confirm token (epic 4 story 3, through epic 5's dialog); built on epic 4's Proposal shape (4.10); epic 8 extends this proposal card, including its Run now? card. Matches key-inbox.html §2 and the proposal card of key-assistant.html."
verify = "Playwright approves the fixture external-effect tool once and the executed arguments equal the well byte for byte; Deny gives the step a tool error; an import Proposal applies as one History entry; a privilege-widening one keeps current access on Return and applies only through the named button; a script and an image in a payload render as text with no network request."
covers = ["R8"]
after = [7, "4.8", "4.10"]
hitl = false
risk = "high"

