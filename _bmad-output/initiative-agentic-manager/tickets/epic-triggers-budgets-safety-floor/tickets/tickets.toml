risk = "high"

[[entry]]
id = 14
type = "story"
title = "Server starts at login and opens signed in"
description = "Removes terminal babysitting before the desktop app (final review UX high 3): `agentic service install|uninstall|status` (CLI class, interactive TTY) registers `agentic serve --project <path> --no-browser` as a per-user macOS LaunchAgent with dataless-file materialisation on, so cloud-only files in linked folders download when read (restated 2026-11-20, architect REPLAN, arch AD-30, AD-32; this story confirms the plist setting on a real File Provider folder) (~/Library/LaunchAgents, 0644, holding the project path and no secret; run at load, restarted only after a crash; logs to `.agentic/logs/`) that keeps every arch AD-13 rule and fails closed with a log line naming why (loose permissions, project locked by another server); the server records its port and pid in a 0600 run file in the app data dir (no secret); `agentic open [--item <id>]` asks the running server with the CLI token to launch the default browser itself with a fresh single-use launch code in the URL fragment, landing on the item when given; the code is never returned to the caller; one open per 10 s, each audited; with no server running it says how to start one; the persisted stop flag still holds under the service, so a restarted service starts nothing until the owner resumes; v1 is macOS only (owner, 2026-11-19; arch AD-47), so on another OS the command compiles and answers 'not supported on this platform yet' (login items there are v1.x). Owner step: install the service on the owner's Mac, log out and back in, and open the app with `agentic open`."
verify = "On the macOS CI runner `agentic service install` writes a plist that `plutil -lint` accepts, holding the project path and `--no-browser` and no secret, and `launchctl print gui/<uid>/<label>` shows it loaded; `uninstall` removes it and `status` reports each state in words; piped input is refused; `agentic open` makes the server launch the browser with a launch code that exchanges once, while the response to `agentic open` holds no code; a second `agentic open` within 10 s is refused with a worded reason; with the stop flag set the service starts and fires nothing; a 0644 data dir makes the service exit with the reason in its log; the owner's record shows the server running after logging back in and `agentic open` landing signed in."
covers = ["R14"]
after = [11, 4, 5, "3.2"]
hitl = true
risk = "medium"

