[[entry]]
id = 17
type = "story"
title = "One privilege-widening classifier for every config path"
description = "Final review 2 security H3 (owner delegated 2026-11-19; arch AD-15): `am-config::is_widening(patch) -> Vec<Widening>` over the typed config patch with a compile-time exhaustive match on every schema field (no wildcard arm, so a new field does not compile until classified), enforced in the writer on every path (UI edit, Proposal, import, Assistant, Developer hat, API, and story 18's Reload and startup), never in the UI; the widening kinds are AD-15's list: any cap raised (seat, workflow, run, week, month, chain, Source limit, max_uses_per_step, max_parallel, max_chain_depth, a linked folder's download wait), a tool grant, a pattern added to a seat's allowed_hosts that its existing patterns do not cover (HostPattern::covers, epic 1 story 14; restated 2026-11-20, architect REPLAN, arch AD-48) or a link host, an MCP server added or re-approved, a tool class lowered, any Account added, a capability switched on, a folder linked to a seat, a linked folder's include patterns widened or its write switch turned on, a folder linked to a seat whose model or fallback is a cloud Account and such a seat's model or fallback moved from a local to a cloud Account (added 2026-11-19, owner folder-access direction), a capability provider Account chosen or changed, a hand-off or accepts entry added or widened, an event trigger into another department, a grant, a human review gate replaced by an AI reviewer or removed, a skill import, an import carrying any of these, the Local search engine list edited and 'Run parsers without OS isolation' turned on; each Widening names the field, the seat or department and the effect sentence the confirmation dialog shows; one confirm token may cover a batch of widenings listed together (arch AD-15, amended 2026-11-19), and a seat created from a role template shipped in the app with its template capabilities unchanged is not widening for those capabilities; (restated 2026-11-20, architect REPLAN, arch AD-15, AD-16, AD-48) a config migration is classified as one ConfigMigration by comparing the old and new snapshots' grants, so epic 1 story 14's egress_hosts migration is not widening; the stored approved grant set is a versioned record with its hash, and a runtime folder with none treats the whole grant set as widening; every committed widening writes one audit entry per widening (kind, seat or file, value; never content) in the apply's transaction. (restated 2026-11-21, Sofia REPLAN; arch AD-15, AD-16) `project_id` (epic 1 story 13) is classified as not widening, and a change to it is an IdentityChange that Reload never applies; a ConfigCreate (every new config file, epic 5 story 16's company.yaml and a Proposal apply's new files included) is classified against an empty grant set (no tools, hosts, Accounts, capabilities, folders, hand-offs, accepts, triggers or grants; caps compared with the loader's defaults), with the shipped-template exception unchanged."
verify = "Written first, failing (crates/am-e2e/tests/trust/widening_*.rs): a property test generates patches over every classified field and asserts each widening kind is flagged identically when the patch arrives as a UI edit, a Proposal, an import, an Assistant proposal and a raw API edit, and that each flagged write without the confirm token changes no file; a table-driven test covers every kind in the list by name, including capability on, provider Account swap, accepts, hand-off, event trigger into D1, a human→AI reviewer swap on F1's Owner gate and removing that gate, a folder link, a write switch turned on, a folder link on a cloud-model seat and a local→cloud model change on a seat with a linked folder; a compile-fail test (trybuild) shows a new schema field without a classification arm does not compile; a batch of three widenings applies with one token naming all three; a Researcher seat created from the shipped template needs no token while the same seat arriving by import does; (restated 2026-11-20, architect REPLAN) a seat gaining *.example.org needs the token while adding docs.example.org beside it does not, the accepted egress_hosts migration fixture flags no widening, and after a batch of three widenings the audit log holds exactly three widening entries naming kind, seat and value; (2026-11-21) a patch changing only project_id is not widening and Reload refuses it as an IdentityChange, a created seat file carrying a tool grant is widening while the same seat from a shipped role template is not, and a created company.yaml with no grants is not widening."
covers = ["R17"]
after = [10, 15, "1.12", "1.13", "1.14"]
