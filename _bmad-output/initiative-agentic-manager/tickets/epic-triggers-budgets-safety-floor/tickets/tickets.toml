# Epic 4 — Triggers, inputs, budgets and safety floor (v0.1). Table order is build order; `id` is permanent.
# `covers` cites this epic's own requirement ids (its epic file's Requirements), not the initiative's: per BMad, every container numbers its own R<n>
# and each epic line names its source as 'parent R<m>'. Outside the initiative file, write initiative ids as 'init R<m>' (final review coverage F8).
# One lane: every story adds to the `agentic` CLI command table, and stories 1-5 and 7-11 share am-engine
# and the am-store migration sequence, so the extract child (6) follows catch-up instead of running beside it.
# 2026-11-19 owner folder-access direction: 6 narrowed to the text fallback, table-import rows and zip (no docx, pptx or OCR); 7 claims any file (text records or file records attached natively); 16 retitled (no OCR child); 17 classifies folder links.

[[entry]]
id = 1
type = "story"
title = "Schedules and manual starts fire runs"
description = "Tracer bullet: the server runs our scheduler loop over croner and jiff through the Clock port, persists each trigger's next fire, last fired and state, and fires a due trigger as a run with origin scheduled (a fire during an active run is skipped and logged); the API gains a Human run-start command and `agentic run` both recording origin manual and queueing behind an active run; `agentic schedules list` shows each trigger read back in words with its next fire and state."
verify = "With FakeClock and a fixture workflow on 'Every Tuesday at 08:00', advancing to the fire time starts exactly one run with origin scheduled; a second fire during it is skipped with a log line; `agentic schedules list` reads 'Every Tuesday at 08:00 · if the Mac was asleep, run once on wake' with the next fire; a run-start over the API and an `agentic run` both record origin manual; trigger state survives a restart."
covers = ["R1", "R3"]
after = ["3.2", "3.8"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Caps reserve against every scope"
description = "Adds the atomic cap check to epic 3's reserve: one writer transaction checks call, step, run, seat (run, week, month), workflow (run, week, month) and company week, choosing scheduled or manual caps by origin; a breach makes no call, moves the step to waiting with a Budget ask naming scope, spend and cap, and pauses the affected schedules with reason budget; an 80% Budget item is raised once per scope and period; an Assistant spend attribution (no seat or run, for epic 8's calls) is checked against call and company week; `agentic status` and the API show settled plus reserved against each cap. The RULE-11 budget suite is written to fail first. Moved here from epic 3 story 14 (final review 2 security M4, 2026-11-19): the concurrent-branch cap test, because epic 3 reserves without checking caps."
verify = "The rule_11 trust tests fail before and pass after: a property test over random FakeLlm usage and caps never settles above any cap at any scope; a call that would breach is not made and its Budget ask names the scope; a scheduled run stops at its lower cap where a manual run continues; the affected schedule shows paused (budget); the 80% item appears once per scope and period; a FakeLlm call attributed to Assistant spend counts toward the company week cap and is refused past it. (concurrent branches, moved from 3.14) on the Company A fixture, three fan-out branches each reserving 40% of a run cap: the third reservation pauses only its branch with one Budget ask for the run, the other two finish, and settled spend never exceeds the cap; 50 random interleavings of branch reservations under FakeClock never jointly pass any shared scope."
covers = ["R4"]
after = [1, "3.7"]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Budget asks and schedule resume, by you only"
description = "Human-only commands resolve a Budget ask (Leave stopped, or Raise once for that scope and period) and pause or resume one schedule at a time, through `agentic gate`, a new `agentic schedules pause|resume` and the API; Raise once is privilege-widening and UI class (arch AD-15, amended 2026-11-18): it needs a second call carrying a single-use confirm token that the server issues only over the live WebSocket of the UI session that asked, bound to that session and that request, expiring in 2 minutes, built here as the primitive the Proposal (story 10) and epics 5 to 10 reuse; `agentic gate` on a Budget ask offers Leave stopped and says where to raise the cap (the app, or the cap in its config file); Leave stopped and schedule resume are CLI-class decisions (epic 9 story 6 adds their refusal while a stdio MCP server is enabled); every resolution is audited with the Human actor. Tests drive a UI session through an API test client (cookie, CSRF value, WebSocket)."
verify = "A Budget ask answered Leave stopped keeps the step waiting and the schedule paused; Raise once with a valid token continues the step and the raise ends with the period; a replayed token, a token older than 2 minutes, a token for another request, a token from another UI session, a token used after its WebSocket closed, a token sent with the CLI token and a non-Human caller are each refused; a fixture child process launched as epic 9 will launch stdio MCP servers (scrubbed environment, inherited descriptors closed, workspace cwd) that reads the app data dir and `.agentic/` and posts Raise once with whatever it finds is refused and audited, the harness that stories 8 and 10 and epic 9 story 6 reuse (final review F2); a test driving every engine command finds none that resumes a schedule or raises a cap; `agentic schedules resume` on a TTY resumes one schedule and piped input is refused."
covers = ["R5"]
after = [2, "3.4"]
hitl = false
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Stop everything holds across restarts"
description = "`agentic stop` and an API stop command cancel every running step at its next safe point through epic 3's cancellation tree, pause every schedule with reason stop and persist a global stop flag (set through the store when no server runs), report what they stopped in words, delete nothing and leave runs waiting on a human as they are; on restart nothing fires; the flag clears on the owner's first resume or manual start while each schedule still resumes on its own. The kill-switch tests join the RULE-11 suite."
verify = "During a FakeLlm stream `agentic stop` ends the step within 1 s with its call settled, every schedule shows paused (stop) and the output reads 'Stopped 1 running workflow and paused 1 schedule'; `agentic stop` with no server sets the flag and a later `agentic serve` with FakeClock past a fire time starts nothing; resuming one schedule leaves the others paused; journal, rows and Inbox items remain."
covers = ["R6"]
after = [3, "3.11"]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "Catch-up after sleep"
description = "The scheduler detects wall-clock jumps across fire times and applies each trigger's catch-up policy from persisted state: once starts one run, skip starts none and logs the missed fires, all queues one run per missed fire in order; catch-up runs record origin catch-up; paused triggers never catch up; DST transitions follow croner's documented semantics, tested in Asia/Kolkata and one DST zone."
verify = "With FakeClock jumping 26 hours across a Tuesday 08:00 fire: once starts exactly one catch-up run, skip starts none with a log line naming the missed fire, and all queues two runs in order for a daily trigger missed twice; a trigger paused by stop or budget starts nothing; spring-forward and fall-back cases in a DST zone fire as croner documents."
covers = ["R2"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Confined paths and the capped extract child"
description = "Adds WorkspacePath (canonicalised, symlink escapes rejected, the only path type file tools, parsers and imports accept) and runs every DocExtractor parse (narrowed 2026-11-19, owner folder-access direction: text decoding of txt, md, csv, tsv and json; a PDF's text layer through pdf_oxide; xlsx and csv rows for table imports through calamine and csv; zip expansion) in an `agentic __extract` child of the same binary with size, page, archive-expansion and time caps, returning text or a worded refusal; adds cargo-fuzz targets for the PDF text layer, xlsx, text decoding and zip and a nightly CI job running each. No docx or pptx reader and no OCR is built: formats are what the seat's model reads (arch AD-30, AD-31; the pptx reader added earlier on 2026-11-19 is retired). The RULE-14 suite is written to fail first. On macOS the child is started from its App-Sandboxed signed copy once story 16 lands (arch AD-13, amended 2026-11-19)."
verify = "The rule_14 trust tests fail before and pass after: `../` paths, absolute paths outside the workspace and a symlink to a file outside it are refused; an oversize file, a zip expanding past the cap, a PDF past the page cap and a parse past the time cap each end in a worded refusal while the engine process stays up; a redistributable public-domain multi-column PDF sample extracts through the child; a scanned PDF with no text layer returns 'no text layer' (a result, not an error); a text file in Windows-1252 decodes to UTF-8; the nightly job runs every fuzz target."
covers = ["R8"]
after = [5]
hitl = false
risk = "high"

[[entry]]
id = 16
type = "story"
title = "Parser child runs inside the macOS App Sandbox"
description = "Final review 2 security H5 (owner delegated 2026-11-19; arch AD-13, AD-47; decision checked on the web 2026-11-19): `xtask sign-helpers` produces, on macOS, `Contents/MacOS/agentic-extract`, a copy of the `agentic` binary signed (ad hoc in dev, Developer ID in release) with an entitlements file holding only com.apple.security.app-sandbox (no inherit, because the parent app is not sandboxed), and am-extract starts every parse as `agentic-extract __extract` from the path am-app gives it, passing input bytes and returning text over stdio only; a sandbox self-test (`agentic doctor --sandbox` and at server start) launches the helper on a canary file in the app data dir and requires the open to fail; on failure, extraction fails closed with a worded Doctor item ('Text fallback and imports are paused: the parser could not be isolated on this Mac.') unless the owner turns on 'Run parsers without OS isolation' (privilege-widening, story 17's classifier, shown on the About page); on non-macOS debug and test builds the helper runs unsandboxed and the self-test reports 'not supported on this platform yet' (arch AD-47). Epic 12 story 18 reuses this signing step for Local search's Python; epic 11 story 16 signs it in the release (the Tesseract helper was retired 2026-11-19 with bundled OCR)."
verify = "Written first, failing (crates/am-e2e/tests/trust/sandbox_extract_*.rs, macOS runner; skipped with a named reason elsewhere): the signed helper given a path to a canary file in the app data dir, to the CLI token file and to a file in a fixture project gets a permission error for each and the canary never appears in its output; it cannot open a TCP or UDP socket; a PDF passed over stdio still extracts; `codesign -d --entitlements -` on the helper lists exactly com.apple.security.app-sandbox; an unsigned helper makes the self-test fail and extraction refuse with the Doctor sentence, and the override without the confirm token is refused."
