# 2026-11-25 (owed from epic 3 story 23's review triage round 1, C2): 17 restated in place: a patch that brings a seat into a fan-out step's `seats:` list is widening, with verify cases on each of the five paths; AD-15's line queued for the architect; id, after, covers, hitl, risk and order unchanged.
# 2026-11-25 (owner decision on epic 3 story 7's plan, Q6): 17 restated in place: an edit to models/prices.yaml that lowers a price or a rates: per_usd value is widening (new rates: field classified); removing a price is not. 13's due wording aligned with the register check (owed from 3.25).
