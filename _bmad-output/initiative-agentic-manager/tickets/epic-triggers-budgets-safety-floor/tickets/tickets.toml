[[entry]]
id = 11
type = "story"
title = "Department export and import as a diff"
description = "`agentic export <team>` writes the team's definition files (seats with their identity, skills, knowledge and links fields, the skills/ folders its seats attach, as they are, workflows, tables, schemas, the tools and MCP specs it uses, egress hosts) as a folder or zip, naming the seats' reference files in its summary without including them (they live in .agentic/, owner statement B 2026-11-18), secret-scanned and refused naming file and line on a hit; `agentic import <folder|zip>` unpacks through story 6's caps and WorkspacePath and raises one Proposal whose diff lists every file and, by name, every tool, MCP server, schedule and egress host it adds, and shows in full every added or changed instruction text (seat and role instructions, seat goals and backstories, every SKILL.md and skill reference file, step instructions, memory notes, guidance notes) flagged 'Instructions written outside this project: read them before applying' (final review F8); the import is privilege-widening when it adds any of those or any instruction text; the CLI prints the diff and the Proposal id, and applying is UI class with the confirm token (epic 5's import dialog); imported schedules arrive paused; API routes serve epic 5's import dialog. The diff and its privilege-widening flag come from story 17's classifier (final review 2 security H3): it also names every capability switched on, every provider Account, every accepts entry, hand-off, event trigger, grant and review gate an import carries, and a review gate whose reviewer is an AI seat where the project had a human one. (restated 2026-11-21, Sofia REPLAN; arch AD-32) A template's or department's seed reference files under `runtime-seed/knowledge/` are listed in the diff and, on apply, copied sha256-checked into the runtime folder's `knowledge/` in that apply, never into the project folder."
