[[entry]]
id = 18
type = "story"
title = "Outside edits and startup that widen wait for the two-step confirmation"
description = "Final review 2 security H4 (owner delegated 2026-11-19; arch AD-16, AD-26): the store persists the approved grant-set fingerprint (a hash of every field story 17 classifies) on each committed apply; epic 1 story 9's Reload and every startup load run story 17's classifier against it, and when the new snapshot widens, it is held: Reload becomes the two-step widening confirmation listing each widening (UI class, confirm token), no run, schedule fire, event trigger or Source load starts until it is confirmed, and the Inbox, banner and Doctor say why ('A file changed outside the app and gives D1-E1 more access. Review it before anything runs.'); a non-widening outside edit keeps the single Reload; stdio MCP children get `.agentic/workspace/mcp/<server-id>/` as cwd, never the project root; the fixture child of story 3's harness gains the case of editing a seat file. (restated 2026-11-21, Sofia REPLAN; arch AD-16 as amended 2026-11-20 and 2026-11-21) A runtime folder with no approved grant set (a project opened from files for the first time on this Mac, including an existing project whose `project_id` story 1.13 just minted, a project opened on a second Mac, one restored onto this Mac or whose runtime folder was deleted, and a copy given its own id by Treat as new project) holds its first load for the two-step confirmation of every widening grant in it. An apply never creates the first approved grant set: only epic 5 story 16's ConfigCreate of company.yaml (baseline from the created file, in the create's History transaction, and likewise when that create's intent is reconciled at startup), a confirmed first-load hold or a confirmed Reload does; a `project_id` write (ConfigIdentityAssign: story 1.13's mint, story 5.19's Keep this project's state and Treat as new project) writes History and audit only."
verify = "Written first, failing (crates/am-e2e/tests/trust/widening_reload_*.rs): a fixture child process editing seats/d1-e1.md to switch Web search on and add a host raises the changed-on-disk event; the plain Reload command is refused for it, the CLI token cannot confirm it, scheduled and manual starts of F1 start zero runs while it is held, and only the UI-class confirmation with the token applies it; the same edit made while the server is stopped is held at the next startup with zero runs started; an outside edit that only changes a goal applies with the single Reload; an MCP fixture server reports its cwd as .agentic/workspace/mcp/<id>/; (2026-11-21) the Company A fixture opened into an empty runtime folder starts zero runs until the UI-class confirmation lists every widening grant and is confirmed, while a store whose baseline was written at create starts without a hold; `widening_first_open_id_less`: a Company A copy with no project_id gets its id minted on first open and still starts zero runs until the confirmation, with no approved grant set written by the mint."
